<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KAS PRIBADI">
<meta name="theme-color" content="#EFEEEB">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>KAS PRIBADI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEEEB; --card:#FAFAF8; --white:#FFFFFF; --ink:#141414; --mut:#8C8A86; --faint:#C2BFB9;
  --line:#E4E2DE; --band:#F3F2EF; --coral:#E8664F;
  --tcols: 64px minmax(0,1.15fr) 104px 98px 112px minmax(0,1fr) 158px 18px; --tgap:8px;
  --rowfs:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:940px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;padding:calc(22px + env(safe-area-inset-top)) 28px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.app.fin-mode{max-width:1020px}
.label{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border-radius:22px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.title{font-size:24px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
.sync{font-size:12px;font-weight:600;color:var(--coral);letter-spacing:0}
.top-right{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:2px;background:var(--card);border-radius:999px;padding:4px}
.tabs a{text-decoration:none;color:var(--mut);font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;min-height:38px;display:flex;align-items:center}
.tabs a[aria-current="page"]{background:var(--ink);color:#fff}
.pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:none;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:600;min-height:44px}

.in{display:block;width:100%;text-overflow:ellipsis;border:none;background:transparent;outline:none;border-radius:9px;padding:6px 6px;font-size:16px;min-width:0}
.in:focus{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--ink)}
.in.num{text-align:right;font-weight:600}
.in.kre{color:var(--coral)}
.in.sal{font-weight:700}
.in.neg{color:var(--coral)}
.in.preview{color:var(--faint)}
.in.err{box-shadow:inset 0 0 0 2px var(--coral)!important}
.in::placeholder{color:var(--faint);font-weight:400}
.rel{position:relative}

/* ---------- TRANSAKSI ---------- */
#page-transaksi{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;gap:12px;flex:none}
.hero{flex:1;min-width:0;padding:16px 20px;display:flex;flex-direction:column;justify-content:center}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.045em;line-height:1;margin-top:8px;white-space:nowrap}
.week{flex:1.25;min-width:0;padding:12px 16px}
.week-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.week-h .nav{display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;width:32px;height:32px;border-radius:50%;background:var(--band);border:none;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;font-size:15px}
.icon-btn input[type=date],.mi input[type=date],.datepill input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;-webkit-appearance:none;appearance:none}
.days{display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;padding:0}
.day small{font-size:10px;font-weight:600;color:var(--mut)}
.day span{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;background:var(--band);color:var(--mut)}
.day.has span{background:var(--ink);color:#fff}
.day.sel span{background:var(--coral);color:#fff}
.day.today span{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--faint)}

.list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.tgrid{display:grid;grid-template-columns:var(--tcols);grid-template-areas:"d n de kr sa k st mo";column-gap:var(--tgap);align-items:center}
.c-d{grid-area:d}.c-n{grid-area:n}.c-de{grid-area:de}.c-kr{grid-area:kr}.c-sa{grid-area:sa}.c-k{grid-area:k;padding-left:6px}.c-st{grid-area:st}.c-mo{grid-area:mo}
.thead{padding:12px 14px 9px;border-bottom:1px solid var(--line);flex:none}
.thead > div{font-size:9.5px}
.r{text-align:right}
.hint{flex:none;text-align:center;font-size:11.5px;color:var(--mut);padding:5px 0;border-bottom:1px solid var(--line);background:var(--card)}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;position:relative;overscroll-behavior:contain}
#trx-scroll{flex:1 1 auto;min-height:0}
.trow{padding:5px 14px;font-size:var(--rowfs)}
.trow .in{font-size:var(--rowfs)}
.trow + .trow{border-top:1px dashed rgba(20,20,20,.08)}
.trow.first{border-top:2px solid var(--white)!important}
.trow.first:first-child{border-top:none!important}
.dcell{line-height:1.15;padding-left:2px}
.dcell small{display:block;font-size:11px;color:var(--mut)}
.dcell b{font-size:14px}
.trow .nm{font-weight:600}
.trow .kt{color:var(--mut)}
.saldo-cell{position:relative}
.pen{position:absolute;left:0;top:50%;transform:translateY(-50%);pointer-events:none}
.status{display:flex;gap:3px;justify-content:flex-start}
.st{border:none;background:transparent;color:var(--faint);font-size:12px;font-weight:600;border-radius:999px;padding:0 9px;min-height:28px;box-shadow:inset 0 0 0 1px #DAD7D1}
.st.p.on{background:var(--coral);color:#fff;box-shadow:none}
.st.d.on{background:var(--ink);color:#fff;box-shadow:none}
.st .sm{display:none}
.more{width:18px;height:28px;border:none;background:transparent;color:var(--faint);font-size:16px;line-height:1;padding:0;position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:180px;background:var(--white);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,20,.14);padding:6px;display:flex;flex-direction:column;text-align:left}
.menu.up{top:auto;bottom:calc(100% + 4px)}
.menu .mi{position:relative;display:flex;align-items:center;min-height:42px;padding:0 12px;border:none;background:transparent;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink);text-align:left;white-space:nowrap}
.menu .mi:hover{background:var(--band)}
.menu .mi.del{color:var(--coral)}
.trow.draft{background:var(--white);border-top:2px solid var(--ink)!important;border-bottom:1px solid var(--line)}
.draft .dcell .in{font-weight:700;font-size:14px;padding:2px 2px;width:56px}
.spacer{pointer-events:none}

.suggest{position:absolute;left:0;top:calc(100% + 4px);z-index:40;width:270px;margin:0;padding:6px;list-style:none;background:var(--white);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,20,.14);max-height:240px;overflow:auto}
.suggest.up{top:auto;bottom:calc(100% + 4px)}
.suggest li{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:10px;font-size:15px;cursor:pointer}
.suggest li.on{background:var(--band)}
.suggest b{font-weight:700}

/* ---------- FINANCE ---------- */
#page-finance{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;gap:12px;align-items:flex-start}
.nab{flex:1.45;min-width:0;overflow:hidden;align-self:flex-start}
.nab-top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:16px 16px 10px}
.nab .big{font-size:26px;font-weight:700;letter-spacing:-.04em;margin-top:4px;line-height:1}
.nab .cap{font-size:12px;color:var(--mut);white-space:nowrap}
.nab .cap b{color:var(--ink);font-weight:600}
.ngrid{display:grid;grid-template-columns:72px 1fr 1fr 1.1fr;column-gap:6px;align-items:center}
.nab-head{padding:0 14px 6px}
.nab-head > div{font-size:9.5px}
#nab-scroll{max-height:calc(5 * 37px + 2px);border-top:1px solid var(--line)}
.nrow{padding:0 14px;height:37px;border-bottom:1px solid var(--line)}
.nrow:last-child{border-bottom:none}
.ndate{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.ndate small{font-size:11.5px;color:var(--mut)}
.ndate .in{font-weight:700;padding:4px 2px;width:56px}
.nab .in{font-size:13.5px}
.nab-draft{margin:8px;background:var(--white);border-radius:999px;padding:3px 4px 3px 8px}
.nab-draft .ngrid{grid-template-columns:64px 1fr 1fr 1.1fr 30px}
.nab .in.num{padding-left:2px;padding-right:2px}
.plus{width:30px;height:30px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;justify-self:end}
.fin-pair{display:contents}
.fcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.datepill{position:relative;align-self:flex-start;display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:700;min-height:36px}
.datepill.coral{background:var(--coral)}
.datepill small{font-weight:500;opacity:.75;font-size:12px}
.lcard{background:var(--card);border-radius:18px;overflow:hidden}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:33px;padding:0 8px 0 12px;border-top:1px solid var(--line)}
.lrow:first-child{border-top:none}
.lrow .nm{font-size:12.5px;color:var(--mut);white-space:nowrap}
.lrow .in.num{width:62%;font-size:13px;padding:4px 4px}
.lrow .in.xn{width:50%;font-size:12.5px;color:var(--mut);padding:4px 0}
.lrow .in.xn::placeholder{font-size:12px}
.lrow.total{background:var(--band);font-weight:700;font-size:13.5px;min-height:35px;padding-right:12px}
.lrow.tab .nm,.lrow.tab .in{color:var(--coral)}
.saldo-pill{background:var(--ink);color:#fff;border-radius:18px;padding:11px 14px;display:flex;justify-content:space-between;align-items:center}
.saldo-pill .label{color:#BDBAB4;font-size:10px}
.saldo-pill .v{font-size:18px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}

/* Riwayat */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.25);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(440px,100%);max-height:80dvh;background:var(--card);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(20,20,20,.2)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
.sheet-h h2{margin:0;font-size:18px}
.hist{list-style:none;margin:0;padding:0 10px 10px;overflow:auto}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-top:1px dashed var(--line)}
.hist li:first-child{border-top:none}
.hist small{display:block;font-size:12px;color:var(--mut)}
.hist b{font-size:15px}
.hist .acts{display:flex;gap:6px}
.hist .acts button{min-height:40px;padding:0 14px;border:none;border-radius:999px;background:var(--band);font-size:13px;font-weight:600}
.empty{padding:24px;text-align:center;color:var(--mut)}

/* ---------- iPad berdiri & layar menengah ---------- */
@media (max-width:1000px){
  :root{ --tcols: 52px minmax(0,1.3fr) 100px 92px 118px minmax(0,.9fr) 58px 16px; --tgap:5px; }
  .trow .in.num{font-size:13.5px;padding-left:2px;padding-right:2px}
  .app{max-width:720px}
  .app.fin-mode{max-width:680px}
  .st{width:26px;height:26px;min-height:26px;padding:0;border-radius:50%;font-size:11px;font-weight:700}
  .st .lg{display:none}.st .sm{display:inline}
  #page-finance{flex-direction:column;align-items:stretch}
  .nab{flex:none;align-self:stretch}
  .fin-pair{display:flex;gap:12px;align-items:flex-start}
}
/* ---------- HP ---------- */
@media (max-width:700px){
  :root{ --tcols: 34px minmax(0,1fr) 66px 60px 78px 22px 12px; --tgap:2px; --rowfs:10.5px; }
  .trow .in.num{font-size:10.5px;padding-left:1px;padding-right:1px}
  .hint{font-size:10.5px;padding:3px 0}
  .tgrid{grid-template-areas:"d n de kr sa st mo" "d k de kr sa st mo"}
  .app{padding-left:10px;padding-right:10px;gap:8px;padding-top:calc(12px + env(safe-area-inset-top))}
  .title{font-size:20px}
  .tabs a{font-size:12px;padding:6px 12px;min-height:34px}
  .pill-btn{padding:7px 11px;font-size:12px;min-height:36px}
  .toprow{flex-direction:column;gap:8px}
  .hero{padding:10px 14px;flex-direction:row;align-items:center;justify-content:space-between}
  .hero .big{font-size:24px;margin-top:0}
  .week{padding:8px 10px}
  .week-h{margin-bottom:4px}
  .icon-btn{width:28px;height:28px}
  .day small{font-size:9px}
  .day span{width:32px;height:32px;font-size:12px}
  .thead{padding:8px 6px 6px}
  .thead > div{font-size:8px;letter-spacing:.06em}
  .thead .c-k{display:none}
  .trow{padding:3px 6px}
  .in{padding:3px 2px}
  .trow .kt{font-size:10px;padding-top:0}
  .in.num{letter-spacing:-.03em}
  .dcell small{font-size:9px}.dcell b{font-size:11px}
  .draft .dcell .in{font-size:11px;width:36px}
  .st{width:20px;height:20px;min-height:20px;font-size:9px}
  .status{flex-direction:column;align-items:center;gap:2px}
  .more{width:12px;font-size:13px}
  .pen{display:none}
  .app.fin-mode{height:auto;min-height:100dvh;overflow:visible}
  #page-finance{overflow:visible}
  .fin-pair{gap:8px}
  .nab .big{font-size:22px}
  .nab .in{font-size:12px}
  .ngrid{grid-template-columns:66px 1fr 1fr 1fr}
  .nab-draft .ngrid{grid-template-columns:60px 1fr 1fr 1fr 28px}
  .nrow{padding:0 10px}.nab-head{padding:0 10px 6px}
  .lrow{padding:0 4px 0 8px;min-height:30px}
  .lrow .nm{font-size:11px}
  .lrow .in.num{font-size:11px;width:66%}
  .lrow .in.xn{font-size:11px;width:52%}
  .lrow .in.xn::placeholder{font-size:10.5px}
  .lrow.total{font-size:11.5px;padding-right:8px}
  .datepill{font-size:11px;padding:6px 10px;min-height:32px}
  .saldo-pill{padding:9px 10px;border-radius:14px}.saldo-pill .v{font-size:14px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title"><span id="page-title">Kas Pribadi</span><span id="sync-badge" class="sync hidden">• menyimpan…</span></div>
    <div class="top-right">
      <button type="button" class="pill-btn hidden" id="btn-riwayat">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Riwayat
      </button>
      <nav class="tabs" aria-label="Halaman">
        <a href="#transaksi" id="tab-transaksi">Transaksi</a>
        <a href="#finance" id="tab-finance">Finance</a>
      </nav>
    </div>
  </header>

  <main id="page-transaksi">
    <div class="toprow">
      <section class="card hero" aria-label="Total saldo kas">
        <div class="label">Total saldo kas</div>
        <div class="big" id="total-saldo">Rp0</div>
      </section>
      <section class="card week" aria-label="Pilih tanggal">
        <div class="week-h">
          <span class="label" id="month-label"></span>
          <div class="nav">
            <button type="button" class="icon-btn" id="wk-prev" aria-label="Minggu sebelumnya">‹</button>
            <button type="button" class="icon-btn" id="wk-next" aria-label="Minggu berikutnya">›</button>
            <label class="icon-btn" aria-label="Pilih tanggal dari kalender">
              <svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <input type="date" id="cal-input" aria-label="Pilih tanggal">
            </label>
          </div>
        </div>
        <div class="days" id="days"></div>
      </section>
    </div>
    <section class="card list" aria-label="Daftar transaksi">
      <div class="tgrid thead">
        <div class="label c-d">Tgl</div><div class="label c-n">Nama</div><div class="label r c-de">Debit</div><div class="label r c-kr">Kredit</div><div class="label r c-sa">Saldo</div><div class="label c-k">Ket.</div><div class="label c-st">Status</div><div class="c-mo"></div>
      </div>
      <div class="hint hidden" id="trx-hint">↓ tarik ke bawah untuk melihat tanggal sebelumnya</div>
      <div class="scroll" id="trx-scroll"></div>
    </section>
  </main>

  <main id="page-finance" class="hidden">
    <section class="card nab" aria-label="Nabung">
      <div class="nab-top">
        <div><div class="label">Nabung</div><div class="big" id="nab-total">Rp0</div></div>
        <div class="cap" id="nab-cap"></div>
      </div>
      <div class="ngrid nab-head"><div class="label">Tgl</div><div class="label r">Debit</div><div class="label r">Kredit</div><div class="label r">Saldo</div></div>
      <div class="scroll" id="nab-scroll"></div>
      <div class="nab-draft" id="nab-draft"></div>
    </section>
    <div class="fin-pair">
      <section class="fcol" id="panel-left" aria-label="Rekap tanggal kiri"></section>
      <section class="fcol" id="panel-right" aria-label="Rekap tanggal kanan"></section>
    </div>
  </main>
</div>

<div class="overlay hidden" id="riwayat" role="dialog" aria-modal="true" aria-labelledby="riwayat-title">
  <div class="sheet">
    <div class="sheet-h">
      <h2 id="riwayat-title">Riwayat Finance</h2>
      <button type="button" class="icon-btn" id="riwayat-close" aria-label="Tutup">✕</button>
    </div>
    <ul class="hist" id="riwayat-list"></ul>
  </div>
</div>

<script src="config.js"></script>
<script>
'use strict';
/* =========================================================
   KAS PRIBADI — frontend
   Backend: Google Apps Script (Code_V1.gs). URL di config.js
   ========================================================= */
const NAMA_AWAL = ['Omset','Pengeluaran Toko','Pengeluaran Pribadi','Nabung','Smartfren','Pengeluaran Keluarga'];
const SUMBER = ['Cash','BCA','BNI','Mandiri','Gopay','Dana','Shopeepay'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI3 = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN3 = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const DAY_COLORS = ['#F4ECDF','#ECE9E3','#FBE6DF','#E9EAE0','#F2E3DA'];
const SHOW_DAYS_TRX = 4;
const PEN = '<svg class="pen" role="img" aria-label="Saldo diisi manual" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8C8A86" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const CAL = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';

/* ---------- Store lokal ---------- */
const KEY = 'kasPribadi.v1';
const Store = {
  load(){
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) { d = null; }
    d = d || {};
    d.transaksi = Array.isArray(d.transaksi) ? d.transaksi : [];
    d.nabung = Array.isArray(d.nabung) ? d.nabung : [];
    d.finance = d.finance && typeof d.finance === 'object' ? d.finance : {};

const API_URL = (window.KAS_API_URL && !/TEMPEL/.test(window.KAS_API_URL)) ? window.KAS_API_URL : '';
const KEY_KEY = 'kasPribadi.key', OUT_KEY = 'kasPribadi.outbox';
const Sync = {
  outbox: (()=>{ try{ return JSON.parse(localStorage.getItem(OUT_KEY)||'[]'); }catch(e){ return []; } })(),
  busy:false, timer:null, pulledOnce:false,
  saveOut(){ try{ localStorage.setItem(OUT_KEY, JSON.stringify(this.outbox)); }catch(e){} updateSyncBadge(); },
  key(){
    let k = ''; try{ k = localStorage.getItem(KEY_KEY) || ''; }catch(e){}
    if (!k){ k = (prompt('Masukkan KUNCI AKSES KAS PRIBADI (dari Apps Script):') || '').trim(); if (k) try{ localStorage.setItem(KEY_KEY,k); }catch(e){} }
    return k;
  },
  async call(action, payload){
    const key = this.key(); if (!key) throw new Error('NO_KEY');
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ key, action, payload: payload||{} }) });
    const j = await res.json();
    if (!j.ok && j.error==='UNAUTHORIZED'){ try{ localStorage.removeItem(KEY_KEY); }catch(e){} alert('Kunci akses salah. Masukkan lagi.'); throw new Error('UNAUTHORIZED'); }
    return j;
  },
  push(action, payload, k){
    if (!API_URL) return;
    this.outbox = this.outbox.filter((op,i)=> !(op.k===k && !(this.busy && i===0)));
    this.outbox.push({ action, payload, k });
    this.saveOut(); this.flush();
  },
  async flush(){
    if (!API_URL || this.busy || !this.outbox.length) return;
    this.busy = true;
    try {
      while (this.outbox.length){
        const op = this.outbox[0];
        const j = await this.call(op.action, op.payload);
        if (!j.ok){ if (j.error==='BUSY') throw new Error('BUSY'); alert('Gagal menyimpan ke Google Sheets: ' + j.error); }
        this.outbox.shift(); this.saveOut();
      }
    } catch(e){ clearTimeout(this.timer); this.timer = setTimeout(()=>this.flush(), 15000); }
    finally { this.busy = false; updateSyncBadge(); }
  },
  async pull(){
    if (!API_URL) return;
    await this.flush();
    if (this.outbox.length || this.busy) return;
    let j; try { j = await this.call('getAll'); } catch(e){ return; }
    if (!j.ok || this.outbox.length) return;
    const d = j.data;
    S.transaksi = d.transaksi || []; S.nabung = d.nabung || []; S.finance = d.finance || {};
    if (d.namaList && d.namaList.length) S.namaList = d.namaList;
    persist(); refreshView();
    if (!this.pulledOnce){ this.pulledOnce = true; scrollToSel(); scrollEnd('nab-scroll'); }
  }
};

  const el=document.getElementById('sync-badge'); if(!el) return;

function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(t){ return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function toDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const t=toDate(iso); t.setDate(t.getDate()+n); return isoOf(t); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function fmtShort(iso){ const [,m,d]=iso.split('-'); return d+'/'+m; }
function dayName(iso){ return HARI[toDate(iso).getDay()]; }
function day3(iso){ return HARI3[toDate(iso).getDay()]; }
function longDate(iso){ const t=toDate(iso); return HARI[t.getDay()]+', '+t.getDate()+' '+BLN3[t.getMonth()]; }
function parseDate(str, refISO){
  str = String(str||'').trim(); if(!str) return null;
  const p = str.split(/[\/\-.\s]+/).filter(Boolean).map(Number);
  if (p.length < 2 || p.some(isNaN)) return null;
  let [d,m,y] = p;
  if (!y) y = Number((refISO||todayISO()).slice(0,4));
  if (y < 100) y += 2000;
  const t = new Date(y,m-1,d);
  if (t.getFullYear()!==y || t.getMonth()!==m-1 || t.getDate()!==d) return null;
  return isoOf(t);
}
const NF = new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
function fmtNum(n){ return (n===null||n===undefined||n==='') ? '' : NF.format(n); }
function fmtRp(n){ return (n===null||n===undefined||n==='') ? '' : (n<0 ? '-Rp' : 'Rp') + NF.format(Math.abs(n)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* Ekspresi angka: + - * / ( ). Titik = pemisah ribuan. Tanpa eval. */
function evalExpr(raw){
  let s = String(raw==null?'':raw).trim();
  if (s === '') return null;
  s = s.replace(/\s+/g,'').replace(/rp/gi,'').replace(/\./g,'').replace(/,/g,'.').replace(/[x×]/gi,'*').replace(/[÷:]/g,'/');
  if (!/^[0-9+\-*/().]+$/.test(s)) return NaN;
  let i = 0;
  function num(){
    if (s[i]==='('){ i++; const v=expr(); if(s[i]!==')') throw 0; i++; return v; }
    if (s[i]==='-'){ i++; return -num(); }
    if (s[i]==='+'){ i++; return num(); }
    const m = /^\d+(\.\d+)?/.exec(s.slice(i)); if(!m) throw 0; i += m[0].length; return parseFloat(m[0]);
  }
  function term(){ let v=num(); while(s[i]==='*'||s[i]==='/'){ const o=s[i++]; const r=num(); if(o==='*') v*=r; else { if(r===0) throw 0; v/=r; } } return v; }
  function expr(){ let v=term(); while(s[i]==='+'||s[i]==='-'){ const o=s[i++]; const r=term(); v = o==='+' ? v+r : v-r; } return v; }
  try { const v = expr(); if (i !== s.length || !isFinite(v)) return NaN; return Math.round(v); }
  catch(e){ return NaN; }
}
/* Titik ribuan langsung saat mengetik, posisi kursor dijaga */
function liveFormat(el){
  const v = el.value; const caret = el.selectionStart==null ? v.length : el.selectionStart;
  const keep = v.slice(0, caret).replace(/\./g,'').length;
  const out = v.replace(/rp/gi,'').replace(/\d[\d.]*/g, tok=>{ const digits = tok.replace(/\./g,''); return digits.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); });
  if (out === v) return;
  el.value = out;
  let pos = 0, cnt = 0;
  while (pos < out.length && cnt < keep){ if (out[pos] !== '.') cnt++; pos++; }
  try { el.setSelectionRange(pos,pos); } catch(e){}
}

let sugg = null;
trxScroll.addEventListener('input', e=>{
  const el = e.target; if (el.dataset.f!=='nama') return;
  const q = el.value.trim().toLowerCase(); closeSuggest(); if (!q) return;
  const items = S.namaList.filter(n=>n.toLowerCase().includes(q)).slice(0,8); if (!items.length) return;
  const ul = document.createElement('ul'); ul.className='suggest'; ul.setAttribute('role','listbox'); ul.setAttribute('aria-label','Saran nama');
  if (trxScroll.getBoundingClientRect().bottom - el.getBoundingClientRect().bottom < 250) ul.classList.add('up');
  ul.innerHTML = items.map(n=>{ const k=n.toLowerCase().indexOf(q); return `<li role="option" data-v="${esc(n)}"><span>${esc(n.slice(0,k))}<b>${esc(n.slice(k,k+q.length))}</b>${esc(n.slice(k+q.length))}</span></li>`; }).join('');
  const host = el.parentElement; host.classList.add('rel'); host.appendChild(ul);
  sugg = { input: el, ul, items, idx:-1 };
  ul.addEventListener('pointerdown', ev=>{
    const li = ev.target.closest('li'); if (!li) return; ev.preventDefault();
    el.value = li.dataset.v; closeSuggest();
    const id = el.closest('[data-id]').dataset.id; skipBlur = el;
    commitTrx(el); renderTrx(); focusTrx(id==='new' || S.transaksi.some(r=>r.id===id) ? id : 'new', 'debit');
  });
});
function closeSuggest(){ if (sugg){ sugg.ul.remove(); sugg=null; } }
function moveSuggest(d){ if(!sugg) return false; sugg.idx=Math.max(0,Math.min(sugg.items.length-1,sugg.idx+d)); [...sugg.ul.children].forEach((li,i)=>li.classList.toggle('on',i===sugg.idx)); return true; }
function pickSuggestOnEnter(el){
  if (!sugg) return false;
  if (sugg.idx>=0){ el.value = sugg.items[sugg.idx]; return true; }
  const exact = sugg.items.find(n=>n.toLowerCase()===el.value.trim().toLowerCase()); if (exact){ el.value = exact; return true; }
  return false;
}

function getNab(id){ return id==='new' ? nabDraft : S.nabung.find(r=>r.id===id); }
function autoNabFor(id){
  const rows = computeNab();
  if (id==='new'){ const p = rows.length ? rows[rows.length-1].saldo : 0; return p + (nabDraft.debit||0) - (nabDraft.kredit||0); }
  const i = rows.findIndex(r=>r.id===id); const p = i>0 ? rows[i-1].saldo : 0; return p + (rows[i].debit||0) - (rows[i].kredit||0);
}
function commitNab(el){
  const id = el.closest('[data-id]').dataset.id, f = el.dataset.f, r = getNab(id); if (!r) return true;
  const v = el.value;
  if (f==='tanggal'){ if (!v.trim()) return true; const iso=parseDate(v, r.tanggal); if(!iso){ flagErr(el); return false; } r.tanggal = iso; }
  else if (f==='debit' || f==='kredit'){ const n=evalExpr(v); if (Number.isNaN(n)){ flagErr(el); return false; } r[f]=n; }
  else if (f==='saldo'){ const n=evalExpr(v); if (Number.isNaN(n)){ flagErr(el); return false; } r.saldoManual = (n===null) ? null : (r.saldoManual==null && n===autoNabFor(id) ? null : n); }

  nabBusy = true; const rec = Object.assign({}, d, { id: uid(), urut: nextUrut() });

   FINANCE — DUA TANGGAL (kolom)
   ========================================================= */
function blankFin(){ return { sumber:{}, extraBefore:[{nama:'',nominal:null},{nama:'',nominal:null}], tabungan:null, extraAfter:[{nama:'',nominal:null},{nama:'',nominal:null}] }; }
function getFin(date){ return S.finance[date] || blankFin(); }
function finCalc(f){
  const total = SUMBER.reduce((a,k)=>a+(f.sumber[k]||0),0) + f.extraBefore.reduce((a,x)=>a+(x.nominal||0),0);
  const saldo = total - (f.tabungan||0) - f.extraAfter.reduce((a,x)=>a+(x.nominal||0),0);
  return { total, saldo };
}
function finIsEmpty(f){ return SUMBER.every(k=>f.sumber[k]==null) && f.tabungan==null && f.extraBefore.every(x=>!x.nama&&x.nominal==null) && f.extraAfter.every(x=>!x.nama&&x.nominal==null); }
function finFmt(k,v){ const t=fmtRp(v); return (k==='tab' && v>0) ? '− '+t : t; }
function renderPanels(){ renderPanel('left'); renderPanel('right'); }
function renderPanel(side){
  const date = S.view[side]; const f = getFin(date); const c = finCalc(f);
  const vin = (k,v,cls,extra)=>`<input class="in num ${cls||''}" data-k="${k}" inputmode="decimal" autocomplete="off" value="${finFmt(k,v)}" aria-label="Nominal" enterkeyhint="next" ${extra||''}>`;
  const xrow = (pre,i,x,ph)=>`<div class="lrow"><input class="in xn" data-k="${pre}n:${i}" value="${esc(x.nama)}" placeholder="${ph}" aria-label="Nama" autocomplete="off" autocapitalize="words" enterkeyhint="next">${vin(pre+'v:'+i, x.nominal)}</div>`;
  document.getElementById('panel-'+side).innerHTML = `<label class="datepill ${side==='left'?'coral':''}">${CAL}<small>${day3(date)}</small>${fmtDate(date)}<input type="date" data-side="${side}" value="${date}" aria-label="Pilih tanggal"></label>
<div class="lcard">${SUMBER.map(k=>`<div class="lrow"><span class="nm">${k}</span>${vin('src:'+k, f.sumber[k])}</div>`).join('')}${f.extraBefore.map((x,i)=>xrow('xb',i,x,'+ Lainnya')).join('')}</div>
<div class="lcard"><div class="lrow total"><span>Total</span><span>${fmtRp(c.total)}</span></div><div class="lrow tab"><span class="nm">Uang Tabungan</span>${vin('tab', f.tabungan, '', 'data-minus="1"')}</div>${f.extraAfter.map((x,i)=>xrow('xa',i,x,'+ Potongan')).join('')}</div>
<div class="saldo-pill"><span class="label">Saldo</span><span class="v">${fmtRp(c.saldo)}</span></div>`;
}
function commitFin(side, el){
  const date = S.view[side]; const k = el.dataset.k; const v = el.value;
  const f = S.finance[date] ? S.finance[date] : blankFin();
  const [kind,key] = k.split(':');
  if (kind==='xbn' || kind==='xan') (kind==='xbn'?f.extraBefore:f.extraAfter)[+key].nama = v.trim();
  else {
    const n = evalExpr(v); if (Number.isNaN(n)){ flagErr(el); return false; }
    if (kind==='src') f.sumber[key]=n; else if (kind==='tab') f.tabungan=n; else if (kind==='xbv') f.extraBefore[+key].nominal=n; else if (kind==='xav') f.extraAfter[+key].nominal=n;
  }
  if (finIsEmpty(f)) delete S.finance[date]; else S.finance[date] = f;
  // kirim hanya kotak yang berubah, supaya isian dari perangkat lain di tanggal yang sama tidak tertimpa
  const val = (kind==='xbn' || kind==='xan') ? (kind==='xbn'?f.extraBefore:f.extraAfter)[+key].nama
            : kind==='src' ? f.sumber[key] : kind==='tab' ? f.tabungan
            : (kind==='xbv'?f.extraBefore:f.extraAfter)[+key].nominal;
  Sync.push('saveFinanceCells', { tanggal: date, cells: { [k]: val==null ? null : val } }, 'fin:'+date+':'+k);
  persist(); return true;
}

riw.addEventListener('click', e=>{
  if (e.target===riw || e.target.closest('#riwayat-close')){ riw.classList.add('hidden'); return; }
  const b=e.target.closest('button[data-d]'); if(!b) return;
  S.view[b.dataset.s]=b.dataset.d; persist(); renderPanels(); riw.classList.add('hidden');
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && !riw.classList.contains('hidden')) riw.classList.add('hidden'); });

/* ---------- Offline ---------- */
function updateNet(){ updateSyncBadge(); }
window.addEventListener('online', updateNet); window.addEventListener('offline', updateNet);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ---------- Mulai ---------- */
showPage();
updateSyncBadge();
Sync.pull();
</script>
