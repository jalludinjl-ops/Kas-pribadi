<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KAS PRIBADI">
<meta name="theme-color" content="#EFEEEB">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>KAS PRIBADI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFEEEB; --card:#FAFAF8; --white:#FFFFFF; --ink:#141414; --mut:#8C8A86; --faint:#C2BFB9;
  --line:#E4E2DE; --band:#F3F2EF; --coral:#E8664F;
  --cols: minmax(0,1fr) 128px 118px 134px 132px 28px; --gap:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.app{max-width:980px;margin:0 auto;height:100vh;height:100dvh;overflow:hidden;padding:calc(22px + env(safe-area-inset-top)) 28px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.app.fin-mode{max-width:1124px}
.label{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.card{background:var(--card);border-radius:22px}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.title{font-size:26px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:baseline;gap:10px}
.sync{font-size:12px;font-weight:600;color:var(--coral);letter-spacing:0}
.top-right{display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:2px;background:var(--card);border-radius:999px;padding:4px}
.tabs a{text-decoration:none;color:var(--mut);font-size:13.5px;font-weight:600;padding:9px 18px;border-radius:999px;min-height:40px;display:flex;align-items:center}
.tabs a[aria-current="page"]{background:var(--ink);color:#fff}
.pill-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:none;border-radius:999px;padding:10px 16px;font-size:13.5px;font-weight:600;min-height:44px}

/* inputs */
.in{display:block;width:100%;border:none;background:transparent;outline:none;border-radius:10px;padding:6px 8px;font-size:16px;min-width:0}
.in:focus{background:var(--white);box-shadow:inset 0 0 0 1.5px var(--ink)}
.in.num{text-align:right;font-weight:600}
.in.kre{color:var(--coral)}
.in.sal{font-weight:700}
.in.neg{color:var(--coral)}
.in.preview{color:var(--faint)}
.in.err{box-shadow:inset 0 0 0 2px var(--coral)!important}
.in::placeholder{color:var(--faint);font-weight:400}

/* ---------- TRANSAKSI ---------- */
#page-transaksi{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:14px}
.toprow{display:flex;gap:14px;flex:none}
.hero{flex:1;padding:16px 20px;display:flex;gap:16px;align-items:flex-end;min-width:0}
.hero .main{flex:1;min-width:0}
.hero .big{font-size:36px;font-weight:700;letter-spacing:-.045em;line-height:1;margin-top:8px;white-space:nowrap}
.hero .cap{font-size:12.5px;color:var(--mut);margin-top:8px}
.hero .cap b{font-weight:600}
.bars{display:flex;gap:5px;width:150px;padding-left:14px;border-left:1px solid var(--line)}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.bar .t{width:10px;height:70px;border-radius:99px;background:var(--band);display:flex;align-items:flex-end;overflow:hidden}
.bar .f{width:10px;border-radius:99px;background:#D9D6D0}
.bar.sel .f{background:var(--coral)}
.bar span{font-size:9px;font-weight:600;color:var(--mut)}
.week{flex:1.2;padding:14px 18px;min-width:0}
.week-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.week-h .nav{display:flex;align-items:center;gap:4px}
.icon-btn{position:relative;width:32px;height:32px;border-radius:50%;background:var(--band);border:none;display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0}
.icon-btn input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;-webkit-appearance:none;appearance:none}
.days{display:flex;justify-content:space-between}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:0}
.day small{font-size:10px;font-weight:600;color:var(--mut)}
.day span{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;background:var(--band);color:var(--mut)}
.day.has span{background:var(--ink);color:#fff}
.day.sel span{background:var(--coral);color:#fff}
.day.today span{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--faint)}

.list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:6px 0 10px}
.cols{display:grid;grid-template-columns:var(--cols);column-gap:var(--gap);align-items:center}
.list-head{padding:12px 20px 8px;flex:none}
.list-head > div{font-size:10px}
.r{text-align:right}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
#trx-scroll{flex:1 1 auto;min-height:0;padding:0 12px}
.grp-h{position:sticky;top:0;z-index:3;background:var(--card);box-shadow:0 6px 8px -6px rgba(20,20,20,.08);display:flex;align-items:baseline;justify-content:space-between;padding:12px 8px 6px;font-size:15px;font-weight:700}
.grp-h small{font-size:12px;font-weight:500;color:var(--mut)}
.grp-h.sel::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--coral);margin-right:8px;align-self:center}
.grp-h .t{margin-right:auto}
.grp-empty{padding:4px 8px 14px;font-size:13px;color:var(--mut)}
.trow{padding:6px 0;border-top:1px dashed var(--line)}
.grp-h + .trow{border-top:none}
.trow .nm{font-size:15px;font-weight:600;padding:4px 8px}
.trow .kt{font-size:12.5px;color:var(--mut);padding:2px 8px}
.saldo-cell{position:relative}
.pen{position:absolute;left:2px;top:50%;transform:translateY(-50%);pointer-events:none}
.status{display:flex;justify-content:flex-end;gap:2px}
.st{border:none;background:transparent;color:var(--faint);font-size:12px;font-weight:600;border-radius:999px;padding:0 9px;min-height:30px}
.st.p.on{background:var(--coral);color:#fff}
.st.d.on{background:var(--ink);color:#fff}
.st .sm{display:none}
.more{width:28px;height:30px;border:none;background:transparent;color:var(--faint);font-size:18px;line-height:1;border-radius:8px;padding:0;position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);z-index:30;min-width:170px;background:var(--white);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,20,.14);padding:6px;display:flex;flex-direction:column;text-align:left}
.menu.up{top:auto;bottom:calc(100% + 4px)}
.menu .mi{position:relative;display:flex;align-items:center;min-height:42px;padding:0 12px;border:none;background:transparent;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink);text-align:left}
.menu .mi:hover{background:var(--band)}
.menu .mi.del{color:var(--coral)}
.menu .mi input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;-webkit-appearance:none;appearance:none}

.draft{margin:8px 10px 0;padding:8px 10px 8px 10px;background:var(--white);border-radius:18px;box-shadow:0 6px 18px rgba(20,20,20,.06);flex:none}
.draft .d-name{display:flex;align-items:flex-start;gap:6px}
.datechip{display:flex;align-items:center;gap:2px;background:var(--band);border-radius:999px;padding:0 4px 0 10px;flex:none;margin-top:2px}
.datechip small{font-size:12px;color:var(--mut)}
.datechip .in{width:64px;font-weight:700;font-size:16px;padding:6px 6px}
.plus{width:36px;height:36px;border-radius:50%;border:none;background:var(--ink);color:#fff;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;justify-self:end}

.suggest{position:absolute;left:0;bottom:calc(100% + 4px);z-index:40;width:280px;margin:0;padding:6px;list-style:none;background:var(--white);border-radius:14px;box-shadow:0 12px 30px rgba(20,20,20,.14);max-height:240px;overflow:auto}
.suggest.down{bottom:auto;top:calc(100% + 4px)}
.suggest li{display:flex;align-items:center;min-height:42px;padding:0 12px;border-radius:10px;font-size:15px;cursor:pointer}
.suggest li.on{background:var(--band)}
.suggest b{font-weight:700}
.rel{position:relative}

/* ---------- FINANCE ---------- */
#page-finance{flex:1 1 auto;min-height:0;display:flex;gap:14px;align-items:flex-start;overflow:auto}
.nab{flex:1.25;min-width:0;padding:16px 16px 14px;display:flex;flex-direction:column;max-height:100%}
.nab .big{font-size:32px;font-weight:700;letter-spacing:-.04em;margin:6px 0 4px;padding:0 4px}
.nab .cap{font-size:12.5px;color:var(--mut);margin-bottom:10px;padding:0 4px}
.nab .cap b{color:var(--ink);font-weight:600}
.ncols{display:grid;grid-template-columns:70px 1fr 1fr 1fr;column-gap:4px;align-items:center}
.nab-head{padding:0 4px 6px}
.nab-head > div{font-size:9.5px}
#nab-scroll{min-height:0;flex:1 1 auto}
.nrow{border-top:1px dashed var(--line);padding:3px 0}
.nrow:first-child{border-top:none}
.ndate{display:flex;align-items:center}
.ndate small{font-size:12px;color:var(--mut);padding-left:4px;flex:none}
.ndate .in{font-weight:700;padding:6px 4px;width:100%}
.nab .in{font-size:13.5px;padding-left:4px;padding-right:4px}
.nab-draft{margin-top:8px;background:var(--white);border-radius:999px;padding:4px 4px 4px 8px;flex:none}
.nab-draft .plus{width:32px;height:32px;font-size:18px}
.nab-draft .ncols{grid-template-columns:70px 1fr 1fr 1fr 32px}

.panel{flex:1;min-width:0;padding:16px}
.panel-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.datepill{position:relative;display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;min-height:40px}
.datepill.coral{background:var(--coral)}
.datepill small{font-weight:500;opacity:.75;font-size:12.5px}
.datepill input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:none;-webkit-appearance:none;appearance:none}
.chev{color:var(--faint)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.tile{background:var(--white);border-radius:14px;padding:8px 6px 4px;min-width:0}
.tile .lb{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding:0 4px}
.tile .in{padding:3px 4px;font-size:13px;font-weight:700;text-align:left;letter-spacing:-.01em}
.tile.x{background:transparent;border:1px dashed #D6D3CD}
.tile.x.filled{background:var(--white);border-color:transparent}
.tile .in.lbin{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:0 4px;height:14px;border-radius:4px}
.tile .in.lbin::placeholder{color:var(--faint);letter-spacing:.02em;text-transform:none;font-size:12px}
.sumrow{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:15px;font-weight:700;padding:0 4px}
.tabrow{display:flex;justify-content:space-between;align-items:center;margin-top:2px;color:var(--coral);font-size:14px;padding-left:4px}
.tabrow .in{width:56%;color:var(--coral);font-size:15px}
.cuts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cuts .tile{padding:6px 6px 2px}
.saldo-box{margin-top:12px;background:var(--ink);color:#fff;border-radius:18px;padding:12px 16px}
.saldo-box .label{color:#BDBAB4}
.saldo-box .v{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:2px;white-space:nowrap}

/* Riwayat */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.25);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(440px,100%);max-height:80dvh;background:var(--card);border-radius:22px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(20,20,20,.2)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
.sheet-h h2{margin:0;font-size:18px}
.hist{list-style:none;margin:0;padding:0 10px 10px;overflow:auto}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-top:1px dashed var(--line)}
.hist li:first-child{border-top:none}
.hist small{display:block;font-size:12px;color:var(--mut)}
.hist b{font-size:15px}
.hist .acts{display:flex;gap:6px}
.hist .acts button{min-height:40px;padding:0 14px;border:none;border-radius:999px;background:var(--band);font-size:13px;font-weight:600}
.empty{padding:24px;text-align:center;color:var(--mut)}

/* ---------- HP ---------- */
@media (max-width:700px){
  :root{ --cols: minmax(0,1fr) 64px 64px 72px 22px 12px; --gap:2px; }
  .app{padding-left:12px;padding-right:12px;gap:10px}
  .title{font-size:22px}
  .tabs a{font-size:12px;padding:7px 12px;min-height:34px}
  .pill-btn{padding:8px 12px;font-size:12px;min-height:36px}
  .toprow{flex-direction:column;gap:10px}
  .hero{padding:12px 16px}
  .hero .big{font-size:28px}
  .bars{width:118px;gap:3px;padding-left:10px}
  .bar .t{height:52px;width:8px}.bar .f{width:8px}
  .week{padding:10px 12px}
  .day span{width:34px;height:34px;font-size:12.5px}
  .list-head{padding:10px 10px 6px}
  .list-head > div{font-size:8px;letter-spacing:.06em}
  #trx-scroll{padding:0 4px}
  .grp-h{font-size:13px;padding:10px 6px 4px}
  .in{padding:5px 3px}
  .in.num{font-size:10px;letter-spacing:-.03em;padding-left:1px;padding-right:1px}
  .trow .nm{font-size:12.5px;padding:3px 4px}
  .trow .kt{font-size:10.5px;padding:1px 4px}
  .st{padding:0;width:20px;min-height:20px;font-size:9px}
  .st .lg{display:none}.st .sm{display:inline}
  .status{flex-direction:column;align-items:center;gap:2px}
  .st:not(.on){box-shadow:inset 0 0 0 1px var(--line)}
  .more{width:14px;font-size:14px}
  .pen{display:none}
  .draft{margin:6px 4px 0;padding:6px}
  .draft .d-name{flex-direction:column;gap:2px}
  .datechip{padding-left:8px}.datechip small{font-size:10px}.datechip .in{width:46px;font-size:12px}
  .plus{width:22px;height:22px;font-size:15px}
  .app.fin-mode{height:auto;min-height:100dvh;overflow:visible}
  #page-finance{flex-direction:column;align-items:stretch;overflow:visible}
  .fin-pair{display:flex;gap:8px}
  .nab{max-height:none}
  #nab-scroll{max-height:38dvh}
  .nab .big{font-size:26px}
  .nab .in{font-size:12px}
  .ncols{grid-template-columns:64px 1fr 1fr 1fr}
  .nab-draft .ncols{grid-template-columns:64px 1fr 1fr 1fr 28px}
  .panel{padding:10px 8px}
  .datepill{font-size:12px;padding:6px 10px;min-height:34px;gap:5px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
  .tile{padding:6px 4px 2px;border-radius:11px}
  .tile .in{font-size:11.5px}
  .tile .lb{font-size:8px}
  .sumrow{font-size:12px}.tabrow{font-size:11px}.tabrow span{white-space:nowrap}.tile .in.lbin::placeholder{font-size:10px}.tabrow .in{font-size:12px;width:60%}
  .saldo-box{padding:10px 12px;border-radius:14px}.saldo-box .v{font-size:17px}
}
@media (min-width:701px){ .fin-pair{display:contents} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title"><span id="page-title">Kas Pribadi</span><span id="sync-badge" class="sync hidden">• menyimpan…</span></div>
    <div class="top-right">
      <button type="button" class="pill-btn hidden" id="btn-riwayat">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Riwayat
      </button>
      <nav class="tabs" aria-label="Halaman">
        <a href="#transaksi" id="tab-transaksi">Transaksi</a>
        <a href="#finance" id="tab-finance">Finance</a>
      </nav>
    </div>
  </header>

  <main id="page-transaksi">
    <div class="toprow">
      <section class="card hero" aria-label="Total saldo kas">
        <div class="main">
          <div class="label">Total saldo kas</div>
          <div class="big" id="total-saldo">Rp0</div>
          <div class="cap" id="hero-cap"></div>
        </div>
        <div class="bars" id="bars" aria-hidden="true"></div>
      </section>
      <section class="card week" aria-label="Pilih tanggal">
        <div class="week-h">
          <span class="label" id="month-label"></span>
          <div class="nav">
            <button type="button" class="icon-btn" id="wk-prev" aria-label="Minggu sebelumnya">‹</button>
            <button type="button" class="icon-btn" id="wk-next" aria-label="Minggu berikutnya">›</button>
            <label class="icon-btn" aria-label="Pilih tanggal dari kalender">
              <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
              <input type="date" id="cal-input" aria-label="Pilih tanggal">
            </label>
          </div>
        </div>
        <div class="days" id="days"></div>
      </section>
    </div>
    <section class="card list" aria-label="Daftar transaksi">
      <div class="cols list-head">
        <div class="label">Nama · Keterangan</div><div class="label r">Debit</div><div class="label r">Kredit</div><div class="label r">Saldo</div><div class="label r">Status</div><div></div>
      </div>
      <div class="scroll" id="trx-scroll"></div>
      <div class="draft" id="trx-draft"></div>
    </section>
  </main>

  <main id="page-finance" class="hidden">
    <section class="card nab" aria-label="Nabung">
      <div class="label" style="padding:0 4px">Nabung</div>
      <div class="big" id="nab-total">Rp0</div>
      <div class="cap" id="nab-cap"></div>
      <div class="ncols nab-head"><div class="label">Tgl</div><div class="label r">Debit</div><div class="label r">Kredit</div><div class="label r">Saldo</div></div>
      <div class="scroll" id="nab-scroll"></div>
      <div class="nab-draft" id="nab-draft"></div>
    </section>
    <div class="fin-pair">
      <section class="card panel" id="panel-left" aria-label="Rekap tanggal kiri"></section>
      <section class="card panel" id="panel-right" aria-label="Rekap tanggal kanan"></section>
    </div>
  </main>
</div>

<div class="overlay hidden" id="riwayat" role="dialog" aria-modal="true" aria-labelledby="riwayat-title">
  <div class="sheet">
    <div class="sheet-h">
      <h2 id="riwayat-title">Riwayat Finance</h2>
      <button type="button" class="icon-btn" id="riwayat-close" aria-label="Tutup">✕</button>
    </div>
    <ul class="hist" id="riwayat-list"></ul>
  </div>
</div>

<script src="config.js"></script>
<script>
'use strict';
/* =========================================================
   KAS PRIBADI — frontend (tema referensi, Ide 2)
   Backend: Google Apps Script (Code_V1.gs). URL di config.js
   ========================================================= */
const NAMA_AWAL = ['Omset','Pengeluaran Toko','Pengeluaran Pribadi','Nabung','Smartfren','Pengeluaran Keluarga'];
const SUMBER = ['Cash','BCA','BNI','Mandiri','Gopay','Dana','Shopeepay'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI3 = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN3 = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const PEN = '<svg class="pen" role="img" aria-label="Saldo diisi manual" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8C8A86" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

/* ---------- Store lokal ---------- */
const KEY = 'kasPribadi.v1';
const Store = {
  load(){
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) { d = null; }
    d = d || {};
    d.transaksi = Array.isArray(d.transaksi) ? d.transaksi : [];
    d.nabung = Array.isArray(d.nabung) ? d.nabung : [];
    d.finance = d.finance && typeof d.finance === 'object' ? d.finance : {};
    d.namaList = Array.isArray(d.namaList) && d.namaList.length ? d.namaList : NAMA_AWAL.slice();
    d.view = d.view || {};
    if (!d.view.left)  d.view.left  = addDays(todayISO(), -1);
    if (!d.view.right) d.view.right = todayISO();
    return d;
  },
  save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) { alert('Gagal menyimpan di perangkat.'); } }
};

/* ---------- Sinkron ke Google Apps Script ---------- */
const API_URL = (window.KAS_API_URL && !/TEMPEL/.test(window.KAS_API_URL)) ? window.KAS_API_URL : '';
const KEY_KEY = 'kasPribadi.key', OUT_KEY = 'kasPribadi.outbox';
const Sync = {
  outbox: (()=>{ try{ return JSON.parse(localStorage.getItem(OUT_KEY)||'[]'); }catch(e){ return []; } })(),
  busy:false, timer:null, pulledOnce:false,
  saveOut(){ try{ localStorage.setItem(OUT_KEY, JSON.stringify(this.outbox)); }catch(e){} updateSyncBadge(); },
  key(){
    let k = ''; try{ k = localStorage.getItem(KEY_KEY) || ''; }catch(e){}
    if (!k){ k = (prompt('Masukkan KUNCI AKSES KAS PRIBADI (dari Apps Script):') || '').trim(); if (k) try{ localStorage.setItem(KEY_KEY,k); }catch(e){} }
    return k;
  },
  async call(action, payload){
    const key = this.key(); if (!key) throw new Error('NO_KEY');
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ key, action, payload: payload||{} }) });
    const j = await res.json();
    if (!j.ok && j.error==='UNAUTHORIZED'){ try{ localStorage.removeItem(KEY_KEY); }catch(e){} alert('Kunci akses salah. Masukkan lagi.'); throw new Error('UNAUTHORIZED'); }
    return j;
  },
  push(action, payload, k){
    if (!API_URL) return;
    this.outbox = this.outbox.filter((op,i)=> !(op.k===k && !(this.busy && i===0)));
    this.outbox.push({ action, payload, k });
    this.saveOut(); this.flush();
  },
  async flush(){
    if (!API_URL || this.busy || !this.outbox.length) return;
    this.busy = true;
    try {
      while (this.outbox.length){
        const op = this.outbox[0];
        const j = await this.call(op.action, op.payload);
        if (!j.ok){ if (j.error==='BUSY') throw new Error('BUSY'); alert('Gagal menyimpan ke Google Sheets: ' + j.error); }
        this.outbox.shift(); this.saveOut();
      }
    } catch(e){ clearTimeout(this.timer); this.timer = setTimeout(()=>this.flush(), 15000); }
    finally { this.busy = false; updateSyncBadge(); }
  },
  async pull(){
    if (!API_URL) return;
    await this.flush();
    if (this.outbox.length || this.busy) return;
    let j; try { j = await this.call('getAll'); } catch(e){ return; }
    if (!j.ok || this.outbox.length) return;
    const d = j.data;
    S.transaksi = d.transaksi || []; S.nabung = d.nabung || []; S.finance = d.finance || {};
    if (d.namaList && d.namaList.length) S.namaList = d.namaList;
    persist(); refreshView();
    if (!this.pulledOnce){ this.pulledOnce = true; scrollToSel(); scrollEnd('nab-scroll'); }
  }
};
function updateSyncBadge(){ const el=document.getElementById('sync-badge'); if(el) el.classList.toggle('hidden', !API_URL || !Sync.outbox.length); }
let pendingRefresh = false;
function refreshView(){
  const a = document.activeElement;
  if (a && a.tagName==='INPUT' && a.type!=='date'){ pendingRefresh = true; return; }
  pendingRefresh = false; renderCurrent();
}
document.addEventListener('focusout', ()=>{ if (pendingRefresh) setTimeout(()=>{ const a=document.activeElement; if(!(a && a.tagName==='INPUT')) refreshView(); },60); });
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') Sync.pull(); });

function trxOut(r){ return { id:r.id, tanggal:r.tanggal, nama:r.nama, debit:r.debit, kredit:r.kredit, saldoManual:r.saldoManual, keterangan:r.keterangan, status:r.status, urut:r.urut }; }
function nabOut(r){ return { id:r.id, tanggal:r.tanggal, debit:r.debit, kredit:r.kredit, saldoManual:r.saldoManual, urut:r.urut }; }

/* ---------- Util ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(t){ return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function toDate(iso){ const [y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const t=toDate(iso); t.setDate(t.getDate()+n); return isoOf(t); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function fmtShort(iso){ const [,m,d]=iso.split('-'); return d+'/'+m; }
function dayName(iso){ return HARI[toDate(iso).getDay()]; }
function day3(iso){ return HARI3[toDate(iso).getDay()]; }
function longDate(iso){ const t=toDate(iso); return HARI[t.getDay()]+', '+t.getDate()+' '+BLN3[t.getMonth()]; }
function parseDate(str, refISO){
  str = String(str||'').trim(); if(!str) return null;
  const p = str.split(/[\/\-.\s]+/).filter(Boolean).map(Number);
  if (p.length < 2 || p.some(isNaN)) return null;
  let [d,m,y] = p;
  if (!y) y = Number((refISO||todayISO()).slice(0,4));
  if (y < 100) y += 2000;
  const t = new Date(y,m-1,d);
  if (t.getFullYear()!==y || t.getMonth()!==m-1 || t.getDate()!==d) return null;
  return isoOf(t);
}
const NF = new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
function fmtNum(n){ return (n===null||n===undefined||n==='') ? '' : NF.format(n); }
function fmtRp(n){ return (n===null||n===undefined||n==='') ? '' : (n<0 ? '-Rp' : 'Rp') + NF.format(Math.abs(n)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)); }
let urutSeq = 0;
function nextUrut(){ return Date.now()*1000 + (urutSeq++ % 1000); }

/* Ekspresi angka: + - * / ( ). Titik = pemisah ribuan. Tanpa eval. */
function evalExpr(raw){
  let s = String(raw==null?'':raw).trim();
  if (s === '') return null;
  s = s.replace(/\s+/g,'').replace(/rp/gi,'').replace(/\./g,'').replace(/,/g,'.').replace(/[x×]/gi,'*').replace(/[÷:]/g,'/');
  if (!/^[0-9+\-*/().]+$/.test(s)) return NaN;
  let i = 0;
  function num(){
    if (s[i]==='('){ i++; const v=expr(); if(s[i]!==')') throw 0; i++; return v; }
    if (s[i]==='-'){ i++; return -num(); }
    if (s[i]==='+'){ i++; return num(); }
    const m = /^\d+(\.\d+)?/.exec(s.slice(i)); if(!m) throw 0; i += m[0].length; return parseFloat(m[0]);
  }
  function term(){ let v=num(); while(s[i]==='*'||s[i]==='/'){ const o=s[i++]; const r=num(); if(o==='*') v*=r; else { if(r===0) throw 0; v/=r; } } return v; }
  function expr(){ let v=term(); while(s[i]==='+'||s[i]==='-'){ const o=s[i++]; const r=term(); v = o==='+' ? v+r : v-r; } return v; }
  try { const v = expr(); if (i !== s.length || !isFinite(v)) return NaN; return Math.round(v); }
  catch(e){ return NaN; }
}
/* Titik ribuan langsung saat mengetik, posisi kursor dijaga */
function liveFormat(el){
  const v = el.value; const caret = el.selectionStart==null ? v.length : el.selectionStart;
  const keep = v.slice(0, caret).replace(/\./g,'').length;
  const out = v.replace(/rp/gi,'').replace(/\d[\d.]*/g, tok=>{ const digits = tok.replace(/\./g,''); return digits.replace(/^0+(?=\d)/,'').replace(/\B(?=(\d{3})+(?!\d))/g,'.'); });
  if (out === v) return;
  el.value = out;
  let pos = 0, cnt = 0;
  while (pos < out.length && cnt < keep){ if (out[pos] !== '.') cnt++; pos++; }
  try { el.setSelectionRange(pos,pos); } catch(e){}
}
document.addEventListener('input', e=>{ const el=e.target; if (el.classList && el.classList.contains('num')) liveFormat(el); }, true);
function numIn(f, val, cls, extra){ return `<input class="in num ${cls||''}" data-f="${f}" inputmode="decimal" autocomplete="off" value="${fmtRp(val)}" ${extra||''}>`; }

/* ---------- State ---------- */
const S = Store.load();
function persist(){ Store.save(S); }
let selDate = todayISO();
let trxDraft = blankTrx();
let nabDraft = blankNab(null);
function blankTrx(){ return { id:'new', nama:'', debit:null, kredit:null, saldoManual:null, keterangan:'', status:'' }; }
function blankNab(tgl){ return { id:'new', tanggal: tgl || nextNabDate(), debit:null, kredit:null, saldoManual:null }; }
function nextNabDate(){ const s=sortedNab(); return s.length ? addDays(s[s.length-1].tanggal,1) : todayISO(); }
function sortedTrx(){ return S.transaksi.slice().sort((a,b)=> a.tanggal.localeCompare(b.tanggal) || a.urut-b.urut); }
function sortedNab(){ return S.nabung.slice().sort((a,b)=> a.tanggal.localeCompare(b.tanggal) || a.urut-b.urut); }
function computeTrx(){
  let prev = 0, lastNama = '';
  return sortedTrx().map(r=>{
    const saldo = r.saldoManual!=null ? r.saldoManual : prev + (r.debit||0) - (r.kredit||0);
    prev = saldo;
    const kategori = r.nama ? r.nama : lastNama; if (r.nama) lastNama = r.nama;
    return Object.assign({}, r, { saldo, kategori });
  });
}
function computeNab(){
  let prev = 0;
  return sortedNab().map(r=>{ const saldo = r.saldoManual!=null ? r.saldoManual : prev + (r.debit||0) - (r.kredit||0); prev = saldo; return Object.assign({}, r, { saldo }); });
}
function addNama(n){ n=(n||'').trim(); if(!n) return n; const hit=S.namaList.find(x=>x.toLowerCase()===n.toLowerCase()); if(hit) return hit; S.namaList.push(n); return n; }
function flagErr(el){ el.classList.add('err'); setTimeout(()=>el.classList.remove('err'),1400); }

/* ---------- Routing ---------- */
function currentPage(){ return location.hash === '#finance' ? 'finance' : 'transaksi'; }
function showPage(){
  const p = currentPage();
  document.querySelector('.app').classList.toggle('fin-mode', p==='finance');
  document.getElementById('page-transaksi').classList.toggle('hidden', p!=='transaksi');
  document.getElementById('page-finance').classList.toggle('hidden', p!=='finance');

  if (p==='transaksi') scrollToSel(); else scrollEnd('nab-scroll');

const trxCard = document.querySelector('#page-transaksi .list');
const trxScroll = document.getElementById('trx-scroll');
const trxDraftEl = document.getElementById('trx-draft');

function endSaldoMap(rows){ const m = {}; rows.forEach(r=>{ m[r.tanggal] = r.saldo; }); return m; }
function saldoAtEnd(dates, map, iso){ let v = null; for (const d of dates){ if (d <= iso) v = map[d]; else break; } return v; }
function weekStart(iso){ const t=toDate(iso); const dow=(t.getDay()+6)%7; t.setDate(t.getDate()-dow); return isoOf(t); }

function renderTrx(){
  const rows = computeTrx();
  const last = rows.length ? rows[rows.length-1].saldo : 0;
  document.getElementById('total-saldo').textContent = fmtRp(last);
  const map = endSaldoMap(rows); const dates = Object.keys(map).sort();
  // caption: perubahan di tanggal terpilih
  const cap = document.getElementById('hero-cap');
  if (map[selDate] !== undefined){
    const prevDates = dates.filter(d=>d<selDate); const before = prevDates.length ? map[prevDates[prevDates.length-1]] : 0;
    const ch = map[selDate] - before;
    cap.innerHTML = `${day3(selDate)} ${fmtShort(selDate)} <b style="color:${ch<0?'var(--coral)':'var(--ink)'}">${ch<0?'−':'+'}${fmtRp(Math.abs(ch))} ${ch<0?'↓':'↑'}</b>`;
  } else cap.textContent = `${day3(selDate)} ${fmtShort(selDate)} · belum ada transaksi`;
  // minggu + grafik
  const ws = weekStart(selDate); const today = todayISO();
  const week = Array.from({length:7},(_,i)=>addDays(ws,i));
  const vals = week.map(d=> d>today ? null : saldoAtEnd(dates,map,d));
  const mx = Math.max(1, ...vals.filter(v=>v!=null && v>0));
  document.getElementById('bars').innerHTML = week.map((d,i)=>{ const v=vals[i]; const h = v==null||v<=0 ? 0 : Math.max(6, Math.round(v/mx*100)); return `<div class="bar ${d===selDate?'sel':''}"><div class="t"><div class="f" style="height:${h}%"></div></div><span>${'SSRKJSM'[i]}</span></div>`; }).join('');
  const t = toDate(selDate);
  document.getElementById('month-label').textContent = BULAN[t.getMonth()]+' '+t.getFullYear();
  document.getElementById('cal-input').value = selDate;
  const has = new Set(dates);
  document.getElementById('days').innerHTML = week.map((d,i)=>`<button type="button" class="day ${has.has(d)?'has':''} ${d===selDate?'sel':''} ${d===today?'today':''}" data-d="${d}" aria-label="${longDate(d)}" aria-pressed="${d===selDate}"><small>${'SSRKJSM'[i]}</small><span>${toDate(d).getDate()}</span></button>`).join('');
  // daftar per tanggal
  const st = trxScroll.scrollTop;
  const groups = []; rows.forEach(r=>{ const g = groups[groups.length-1]; if (g && g.d===r.tanggal) g.rows.push(r); else groups.push({ d:r.tanggal, rows:[r] }); });
  if (!groups.some(g=>g.d===selDate)){ groups.push({ d:selDate, rows:[] }); groups.sort((a,b)=>a.d.localeCompare(b.d)); }
  trxScroll.innerHTML = groups.map(g=>`<div class="grp-h ${g.d===selDate?'sel':''}" data-g="${g.d}"><span class="t">${longDate(g.d)}</span><small>${g.rows.length ? g.rows.length+' transaksi' : ''}</small></div>`
    + (g.rows.length ? g.rows.map(trxRowHTML).join('') : `<div class="grp-empty">Belum ada transaksi — isi di baris bawah.</div>`)).join('');
  trxScroll.scrollTop = st;
  renderDraft(last);
}
function statusHTML(s){
  return `<div class="status"><button type="button" class="st p ${s==='Pending'?'on':''}" data-s="Pending" aria-pressed="${s==='Pending'}" aria-label="Pending"><span class="lg">Pending</span><span class="sm">P</span></button><button type="button" class="st d ${s==='Done'?'on':''}" data-s="Done" aria-pressed="${s==='Done'}" aria-label="Done"><span class="lg">Done</span><span class="sm">D</span></button></div>`;
}
function trxRowHTML(r){
  const manual = r.saldoManual!=null;
  return `<div class="trow cols" data-id="${r.id}">
<div><input class="in nm" data-f="nama" value="${esc(r.nama)}" placeholder="—" aria-label="Nama" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="next"><input class="in kt" data-f="keterangan" value="${esc(r.keterangan)}" aria-label="Keterangan" autocomplete="off" enterkeyhint="next"></div>
<div>${numIn('debit', r.debit, '', 'aria-label="Debit" enterkeyhint="next"')}</div>

${statusHTML(r.status)}
<button type="button" class="more" aria-label="Lainnya">⋯</button>
</div>`;
}

  const d = trxDraft; const manual = d.saldoManual!=null;
  const sal = manual ? d.saldoManual : last + (d.debit||0) - (d.kredit||0);
  const ae = document.activeElement; const keep = ae && trxDraftEl.contains(ae) ? ae.dataset.f : null;
  trxDraftEl.innerHTML = `<div class="cols" data-id="new">
<div class="d-name"><span class="datechip"><small>${day3(selDate)}</small><input class="in" data-f="tanggal" value="${fmtShort(selDate)}" aria-label="Tanggal" autocomplete="off" enterkeyhint="next"></span>
<div style="flex:1;min-width:0" class="rel"><input class="in nm" data-f="nama" value="${esc(d.nama)}" placeholder="Nama" style="font-size:15px;font-weight:600" aria-label="Nama" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="next"><input class="in kt" data-f="keterangan" value="${esc(d.keterangan)}" placeholder="Keterangan" style="font-size:12.5px;color:var(--mut)" aria-label="Keterangan" autocomplete="off" enterkeyhint="done"></div></div>
<div>${numIn('debit', d.debit, '', 'placeholder="Debit" aria-label="Debit" enterkeyhint="next"')}</div>
<div>${numIn('kredit', d.kredit, 'kre', 'placeholder="Kredit" aria-label="Kredit" enterkeyhint="next"')}</div>
<div class="saldo-cell">${manual?PEN:''}${numIn('saldo', sal, 'sal '+(manual?'':'preview ')+(sal<0?'neg':''), 'aria-label="Saldo" enterkeyhint="next"')}</div>
${statusHTML(d.status)}
<button type="button" class="plus" aria-label="Simpan transaksi">+</button>
</div>`;
  if (keep){ const el = trxDraftEl.querySelector(`[data-f="${keep}"]`); if (el) el.focus(); }

function getTrx(id){ return id==='new' ? trxDraft : S.transaksi.find(r=>r.id===id); }
function trxIsEmpty(r){ return !r.nama && r.debit==null && r.kredit==null && r.saldoManual==null && !r.keterangan && !r.status; }
function autoSaldoFor(id){
  const rows = computeTrx();
  if (id==='new'){ const p = rows.length ? rows[rows.length-1].saldo : 0; return p + (trxDraft.debit||0) - (trxDraft.kredit||0); }
  const i = rows.findIndex(r=>r.id===id); const prev = i>0 ? rows[i-1].saldo : 0; const r = rows[i];
  return prev + (r.debit||0) - (r.kredit||0);
}
function saveTrxRow(r){ persist(); Sync.push('saveTransaksi', { row: trxOut(r) }, 'trx:'+r.id); }
function deleteTrxRow(id){ S.transaksi = S.transaksi.filter(x=>x.id!==id); persist(); Sync.push('deleteTransaksi', { id }, 'trx:'+id); }
function setSel(iso){ if (!iso) return; selDate = iso; trxDraft.tanggal = iso; }
function blurActive(){ const a=document.activeElement; if (a && a.tagName==='INPUT' && a.type!=='date') a.blur(); }
/* Jalankan aksi setelah input yang sedang diedit tersimpan (hindari ketukan hilang karena render ulang) */
let pdHandled = false;
function act(getArg, fn){
  return e=>{
    if (e.type==='pointerdown'){ if (e.button>0) return; e.preventDefault(); pdHandled = true; setTimeout(()=>pdHandled=false, 500); }
    else if (pdHandled) return;
    const arg = getArg(e); if (arg===undefined) return;
    blurActive(); setTimeout(()=>fn(arg), 0);
  };
}

function commitTrx(el){
  const holder = el.closest('[data-id]'); if (!holder) return true;
  const id = holder.dataset.id, f = el.dataset.f, v = el.value;
  if (f==='tanggal'){ // hanya baris baru
    if (!v.trim()) return true;
    const iso = parseDate(v, selDate); if (!iso){ flagErr(el); return false; }
    setSel(iso); trxDraft.tanggal = iso; return true;
  }
  const r = getTrx(id); if (!r) return true;
  if (id==='new') r.tanggal = selDate;
  if (f==='nama') r.nama = v.trim() ? addNama(v) : '';
  else if (f==='keterangan') r.keterangan = v.trim();
  else if (f==='debit' || f==='kredit'){ const n = evalExpr(v); if (Number.isNaN(n)){ flagErr(el); return false; } r[f] = n; }
  else if (f==='saldo'){
    const n = evalExpr(v); if (Number.isNaN(n)){ flagErr(el); return false; }
    r.saldoManual = (n===null) ? null : (r.saldoManual==null && n===autoSaldoFor(id) ? null : n);
  }
  if (id!=='new'){
    if (trxIsEmpty(r) && confirm('Baris ini kosong. Hapus baris?')) deleteTrxRow(id);
    else saveTrxRow(r);
  }
  return true;
}
let draftBusy = false;
function commitDraft(){
  if (draftBusy) return false;
  const d = trxDraft;
  if (!d.nama && d.debit==null && d.kredit==null && d.saldoManual==null && !d.keterangan) return false;
  draftBusy = true;
  const rec = Object.assign({}, d, { id: uid(), urut: nextUrut(), tanggal: d.tanggal || selDate });
  S.transaksi.push(rec); saveTrxRow(rec);
  trxDraft = blankTrx();
  draftBusy = false; return true;
}
function focusTrx(id, f){
  const holder = id==='new' ? trxDraftEl.querySelector('[data-id="new"]') : trxScroll.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if (!holder) return; const el = holder.querySelector(`[data-f="${f}"]`); if (!el) return;
  el.focus({preventScroll:true}); if (id!=='new') el.scrollIntoView({block:'nearest'});
}

const TRX_ORDER_ROW = ['nama','debit','kredit','keterangan'];

function commitNab(el){

function blankFin(){ return { sumber:{}, extraBefore:[{nama:'',nominal:null},{nama:'',nominal:null}], tabungan:null, extraAfter:[{nama:'',nominal:null},{nama:'',nominal:null}] }; }
function getFin(date){ return S.finance[date] || blankFin(); }
function finCalc(f){
  const total = SUMBER.reduce((a,k)=>a+(f.sumber[k]||0),0) + f.extraBefore.reduce((a,x)=>a+(x.nominal||0),0);
  const saldo = total - (f.tabungan||0) - f.extraAfter.reduce((a,x)=>a+(x.nominal||0),0);
  return { total, saldo };
}
function finIsEmpty(f){ return SUMBER.every(k=>f.sumber[k]==null) && f.tabungan==null && f.extraBefore.every(x=>!x.nama&&x.nominal==null) && f.extraAfter.every(x=>!x.nama&&x.nominal==null); }
function renderPanels(){ renderPanel('left'); renderPanel('right'); }
function renderPanel(side){
  const date = S.view[side]; const f = getFin(date); const c = finCalc(f);

  const xtile = (pre,i,x,ph)=>`<div class="tile x ${x.nama||x.nominal!=null?'filled':''}"><input class="in lbin" data-k="${pre}n:${i}" value="${esc(x.nama)}" placeholder="${ph}" aria-label="Nama" autocomplete="off" autocapitalize="words" enterkeyhint="next">${vin(pre+'v:'+i, x.nominal)}</div>`;
  const el = document.getElementById('panel-'+side);

<div class="tiles" data-side="${side}">${SUMBER.map(k=>tile(k,k)).join('')}${f.extraBefore.map((x,i)=>xtile('xb',i,x,'+ Lainnya')).join('')}</div>
<div class="sumrow"><span>Total</span><span>${fmtRp(c.total)}</span></div>
<div class="tabrow" data-side="${side}"><span>Uang Tabungan</span>${vin('tab', f.tabungan, 'placeholder="−"')}</div>
<div class="cuts" data-side="${side}">${f.extraAfter.map((x,i)=>xtile('xa',i,x,'+ Potongan')).join('')}</div>
<div class="saldo-box"><div class="label">Saldo</div><div class="v">${fmtRp(c.saldo)}</div></div>`;
}
function commitFin(side, el){
  const date = S.view[side]; const k = el.dataset.k; const v = el.value;
  const f = S.finance[date] ? S.finance[date] : blankFin();
  const [kind,key] = k.split(':');
  if (kind==='xbn' || kind==='xan') (kind==='xbn'?f.extraBefore:f.extraAfter)[+key].nama = v.trim();
  else {
    const n = evalExpr(v); if (Number.isNaN(n)){ flagErr(el); return false; }
    if (kind==='src') f.sumber[key]=n; else if (kind==='tab') f.tabungan=n; else if (kind==='xbv') f.extraBefore[+key].nominal=n; else if (kind==='xav') f.extraAfter[+key].nominal=n;
  }
  if (finIsEmpty(f)){ delete S.finance[date]; Sync.push('deleteFinance', { tanggal: date }, 'fin:'+date); }
  else { S.finance[date] = f; Sync.push('saveFinance', { tanggal: date, data: f }, 'fin:'+date); }
  persist(); return true;
}

  const el=e.target; if(!el.dataset || !el.dataset.k) return;
  if (finSkip===el){ finSkip=null; return; }
  const side = sideOf(el);
  if (el.value===el.dataset.orig){ setTimeout(()=>{ const a=document.activeElement; if (!(a && a.dataset && a.dataset.k)) renderPanels(); },0); return; }
  if (!commitFin(side, el)){ el.value=el.dataset.orig; return; }
  setTimeout(()=>{ const a=document.activeElement; const keep = a && a.dataset && a.dataset.k ? { side: sideOf(a), k: a.dataset.k } : null; renderPanels(); if (keep) focusFin(keep.side, keep.k); },0);
});
finPage.addEventListener('keydown', e=>{
  const el=e.target; if(!el.dataset || !el.dataset.k || e.key!=='Enter') return;
  e.preventDefault();
  const side = sideOf(el); const list=[...document.querySelectorAll(`#panel-${side} input[data-k]`)]; const i=list.indexOf(el);
  const next = list[i+1] ? list[i+1].dataset.k : null;
  finSkip = el;
  if (el.value!==el.dataset.orig && !commitFin(side, el)){ finSkip=null; el.value=el.dataset.orig; return; }
  renderPanels(); if (next) focusFin(side, next); else if (document.activeElement) document.activeElement.blur();
});
function focusFin(side,k){ const el=document.querySelector(`#panel-${side} input[data-k="${CSS.escape(k)}"]`); if(el){ el.focus(); try{ el.select(); }catch(_){} } }

/* Riwayat */
const riw = document.getElementById('riwayat');
document.getElementById('btn-riwayat').addEventListener('click', ()=>{
  const dates = Object.keys(S.finance).sort().reverse();
  document.getElementById('riwayat-list').innerHTML = dates.length ? dates.map(d=>{ const c=finCalc(S.finance[d]); return `<li><div><small>${dayName(d)}</small><b>${fmtDate(d)}</b><small>Saldo ${fmtRp(c.saldo)}</small></div><div class="acts"><button type="button" data-d="${d}" data-s="left" aria-label="Buka ${fmtDate(d)} di kartu kiri">Kiri</button><button type="button" data-d="${d}" data-s="right" aria-label="Buka ${fmtDate(d)} di kartu kanan">Kanan</button></div></li>`; }).join('') : '<li class="empty">Belum ada catatan.</li>';
  riw.classList.remove('hidden'); document.getElementById('riwayat-close').focus();
});
riw.addEventListener('click', e=>{
  if (e.target===riw || e.target.closest('#riwayat-close')){ riw.classList.add('hidden'); return; }
  const b=e.target.closest('button[data-d]'); if(!b) return;
  S.view[b.dataset.s]=b.dataset.d; persist(); renderPanels(); riw.classList.add('hidden');
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && !riw.classList.contains('hidden')) riw.classList.add('hidden'); });

/* ---------- Mulai ---------- */
showPage();
updateSyncBadge();
Sync.pull();
</script>
