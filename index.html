<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KAS PRIBADI">
<meta name="theme-color" content="#F5F7FB">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>KAS PRIBADI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B2A4A; --navy-2:#33456A; --ink:#1B2A4A; --muted:#56688C; --soft:#3D4F73;
  --bg:#F5F7FB; --line:#D9E0EC; --focus:#4C6FB3;
  --debit:#0F7A4A; --kredit:#C2410C; --neg:#B42318;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
input{font:inherit;color:inherit}
.app{max-width:1180px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 28px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px;min-height:100dvh}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.brand{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--muted)}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:.02em}
.top-right{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
nav.tabs{display:flex;background:#E4E9F2;border-radius:12px;padding:4px;gap:4px}
nav.tabs a{text-decoration:none;display:flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:9px;color:var(--soft);font-size:14px;font-weight:600;letter-spacing:.04em}
nav.tabs a[aria-current="page"]{background:var(--navy);color:#fff}
.btn{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 18px;border:1px solid #C9D3E5;border-radius:12px;background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.btn svg{flex:none}
.hidden{display:none!important}
.sync{letter-spacing:0;font-weight:500;color:#B45309;margin-left:6px}

/* Kartu saldo */
.saldo-card{position:relative;overflow:hidden;background:var(--navy);border-radius:18px;padding:18px 26px;color:#fff;display:flex;flex-direction:column;gap:6px}
.saldo-card .lbl{position:relative;font-size:13px;font-weight:600;letter-spacing:.12em;color:#C9D4EA}
.saldo-card .val{position:relative;font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.saldo-card .dot{position:absolute;border-radius:50%}

/* Tabel umum */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;text-align:left;font-size:12px;font-weight:600;letter-spacing:.08em;padding:0 12px;height:46px;border-right:1px solid var(--navy-2);white-space:nowrap}
th:last-child{border-right:none}
th.r{text-align:right}
th.c-debit{color:#8EE3B5} th.c-kredit{color:#FDBA8C}
td{padding:0;border:1px solid var(--line);position:relative;vertical-align:middle}
td:first-child{border-left:none} td:last-child{border-right:none}
td input{display:block;width:100%;height:54px;border:none;background:transparent;padding:0 12px;font-size:16px;outline:none;border-radius:0}
td input:focus{outline:2px solid var(--focus);outline-offset:-2px;background:rgba(255,255,255,.7)}
td input.num{text-align:right}
td input.debit{color:var(--debit);font-weight:600}
td input.kredit{color:var(--kredit);font-weight:600}
td input.saldo{font-weight:700}
td input.neg{color:var(--neg)}
td input.err{outline:2px solid var(--neg)!important;outline-offset:-2px}
td input.ket{color:var(--soft)}
.pen{position:absolute;left:8px;top:50%;transform:translateY(-50%);pointer-events:none}
.datecell{display:flex;flex-direction:column;justify-content:center;min-height:54px}
.datecell .day{font-size:12px;color:var(--muted);padding:0 12px;margin-bottom:-14px;margin-top:6px;pointer-events:none;position:relative;z-index:1}
.datecell input{font-weight:600}
.datecell.has-day input{padding-top:12px}

/* Transaksi */
#page-transaksi{display:flex;flex-direction:column;gap:18px;flex:1;min-height:0}
#trx-wrap{max-height:calc(100dvh - 300px);min-height:320px}
#trx-table{min-width:980px}
tr.grp td{border-top:2px solid #7F93B8 !important}
tr.draft td{background:#fff}
.status-btn{display:flex;align-items:center;width:100%;min-height:54px;padding:0 12px;border:none;background:transparent;cursor:pointer;text-align:left}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600}
.pill.p{background:#FBE7E5;color:#B42318}
.pill.d{background:#E3F3EA;color:#146C43}
.menu{position:absolute;right:6px;top:calc(100% + 2px);z-index:20;width:170px;padding:6px;display:flex;flex-direction:column;gap:2px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(27,42,74,.16)}
.menu.up{top:auto;bottom:calc(100% + 2px)}
.menu button{display:flex;align-items:center;min-height:44px;padding:0 10px;border:none;border-radius:8px;background:transparent;cursor:pointer;text-align:left}
.menu button:hover,.menu button:focus{background:#EEF3FB}
.menu .clear{border-top:1px solid #EDF1F7;border-radius:0 0 8px 8px;font-size:14px;color:var(--muted)}
.suggest{position:absolute;left:0;top:calc(100% + 2px);z-index:20;width:270px;margin:0;padding:6px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px rgba(27,42,74,.14);max-height:240px;overflow:auto}
.suggest.up{top:auto;bottom:calc(100% + 2px)}
.suggest li{display:flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;font-size:16px;cursor:pointer}
.suggest li.on{background:#EAF1FB}
.suggest b{font-weight:700}

/* Finance */
#page-finance{flex:1;display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.fin-col{flex:1 1 300px}
.nab-col{flex:1.45 1 420px}
.col-head{min-height:72px;padding:12px 14px;display:flex;align-items:center;border-bottom:1px solid var(--line)}
.nab-col .col-head{background:#E0D4FF;border-color:#C2AEF5}
.nab-col h2{margin:0;font-size:18px;font-weight:700;letter-spacing:.08em;color:#2E1F66;padding-left:2px}
#nab-wrap{flex:1 1 0;min-height:380px}
#nab-table{min-width:400px}
#nab-table th{font-size:11px;padding:0 10px}
#nab-table td input{padding:0 10px}
.datebtn{position:relative;display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border-radius:12px;background:#fff;cursor:pointer}
.datebtn input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;border:none}
.datebtn .t{display:flex;flex-direction:column;line-height:1.2}
.datebtn .t small{font-size:12px;color:var(--muted)}
.datebtn .t span{font-size:16px;font-weight:700}
.fin-table thead th{position:static;background:#E4EBF6;color:var(--soft);height:42px;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.fin-table td input{height:46px}
.fin-table td.name{padding:0 14px;height:46px;font-size:16px}
.fin-table td.name input{padding:0}
.fin-table tr.total td{background:#C5DCFF;font-weight:700;border-top:2px solid #7F93B8}
.fin-table tr.total td.v{padding:0 14px;text-align:right;font-size:17px}
.fin-table tr.tab td{background:#FFE396;color:#6B4E00}
.fin-table tr.tab input{color:#6B4E00}
.fin-table tr.saldo td{background:var(--navy);color:#fff;font-weight:700;border-color:var(--navy-2);height:56px}
.fin-table tr.saldo td.name{letter-spacing:.04em}
.fin-table tr.saldo td.v{padding:0 14px;text-align:right;font-size:19px}
.fin-table tr.saldo td.v.neg{color:#FFB4AB}
.fin-table td.v.neg{color:var(--neg)}

/* Riwayat */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(15,26,51,.35);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet{width:min(460px,100%);max-height:80dvh;background:#fff;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(15,26,51,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:18px}
.iconbtn{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border:none;background:transparent;border-radius:10px;cursor:pointer}
.hist{list-style:none;margin:0;padding:8px;overflow:auto}
.hist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:10px}
.hist li:nth-child(odd){background:#F5F7FB}
.hist .d small{display:block;font-size:12px;color:var(--muted)}
.hist .d b{font-size:16px}
.hist .d span{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.hist .acts{display:flex;gap:6px}
.hist .acts button{min-height:44px;padding:0 12px;border:1px solid #C9D3E5;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.empty{padding:24px;text-align:center;color:var(--muted)}

@media (max-width:700px){
  .app{padding-left:14px;padding-right:14px}
  h1{font-size:26px}
  .saldo-card .val{font-size:30px}
  #trx-wrap{max-height:calc(100dvh - 330px)}
  #nab-wrap{flex:none;max-height:60dvh}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="brand">KAS PRIBADI <span id="sync-badge" class="sync hidden">• menyimpan…</span></div>
      <h1 id="page-title">TRANSAKSI</h1>
    </div>
    <div class="top-right">
      <button type="button" class="btn hidden" id="btn-riwayat">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4F73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>Riwayat
      </button>
      <nav class="tabs" aria-label="Halaman">
        <a href="#transaksi" id="tab-transaksi">TRANSAKSI</a>
        <a href="#finance" id="tab-finance">FINANCE</a>
      </nav>
    </div>
  </header>

  <main id="page-transaksi">
    <section class="saldo-card" aria-label="Total saldo kas">
      <div class="dot" aria-hidden="true" style="right:150px;top:-60px;width:180px;height:180px;background:#7FA8F0;opacity:.35"></div>
      <div class="dot" aria-hidden="true" style="right:40px;top:30px;width:140px;height:140px;background:#8EE3B5;opacity:.35"></div>
      <div class="dot" aria-hidden="true" style="right:-30px;top:-40px;width:120px;height:120px;background:#FDBA8C;opacity:.4"></div>
      <div class="lbl">TOTAL SALDO KAS</div>
      <div class="val" id="total-saldo">Rp0</div>
    </section>
    <section class="card" aria-label="Tabel transaksi">
      <div class="scroll" id="trx-wrap">
        <table id="trx-table">
          <colgroup><col style="width:130px"><col style="width:210px"><col style="width:132px"><col style="width:132px"><col style="width:150px"><col><col style="width:110px"></colgroup>
          <thead><tr>
            <th scope="col">HARI / TANGGAL</th><th scope="col">NAMA</th><th scope="col" class="r c-debit">DEBIT</th><th scope="col" class="r c-kredit">KREDIT</th><th scope="col" class="r">SALDO</th><th scope="col">KETERANGAN</th><th scope="col">STATUS</th>
          </tr></thead>
          <tbody id="trx-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <main id="page-finance" class="hidden">
    <section class="card nab-col" aria-label="Tabel nabung">
      <div class="col-head"><h2>NABUNG</h2></div>
      <div class="scroll" id="nab-wrap">
        <table id="nab-table">
          <colgroup><col style="width:30%"><col><col><col></colgroup>
          <thead><tr><th scope="col">HARI / TANGGAL</th><th scope="col" class="r c-debit">DEBIT</th><th scope="col" class="r c-kredit">KREDIT</th><th scope="col" class="r">SALDO</th></tr></thead>
          <tbody id="nab-body"></tbody>
        </table>
      </div>
    </section>
    <section class="card fin-col" id="panel-left" aria-label="Rekap tanggal kiri"></section>
    <section class="card fin-col" id="panel-right" aria-label="Rekap tanggal kanan"></section>
  </main>
</div>

<div class="overlay hidden" id="riwayat" role="dialog" aria-modal="true" aria-labelledby="riwayat-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="riwayat-title">Riwayat Finance</h2>
      <button type="button" class="iconbtn" id="riwayat-close" aria-label="Tutup">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2A4A" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <ul class="hist" id="riwayat-list"></ul>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   KAS PRIBADI — frontend
   Penyimpanan sementara: localStorage perangkat.
   Nanti diganti ke Google Apps Script (lihat Store di bawah).
   ========================================================= */

const NAMA_AWAL = ['Omset','Pengeluaran Toko','Pengeluaran Pribadi','Nabung','Smartfren','Pengeluaran Keluarga'];
const SUMBER = ['Cash','BCA','BNI','Mandiri','Gopay','Dana','Shopeepay'];
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const ROW_COLORS = [
  ['#DDEBFF','#BFD3F0'],['#D8F3E3','#B6DEC6'],['#FFE4D1','#F1C9AC'],
  ['#ECE4FF','#D3C4F5'],['#FFF1C2','#EBD58C'],['#FFE0EC','#F0BCD0']
];
const PEN = '<svg class="pen" role="img" aria-label="Saldo diisi manual" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#56688C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

/* ---------- Store ---------- */
const KEY = 'kasPribadi.v1';
const Store = {
  load(){
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) { d = null; }
    d = d || {};
    d.transaksi = Array.isArray(d.transaksi) ? d.transaksi : [];
    d.nabung = Array.isArray(d.nabung) ? d.nabung : [];
    d.finance = d.finance && typeof d.finance === 'object' ? d.finance : {};
    d.namaList = Array.isArray(d.namaList) && d.namaList.length ? d.namaList : NAMA_AWAL.slice();
    d.view = d.view || {};
    if (!d.view.left)  d.view.left  = addDays(todayISO(), -1);
    if (!d.view.right) d.view.right = todayISO();
    return d;
  },
  save(d){
    try { localStorage.setItem(KEY, JSON.stringify(d)); }
    catch(e) { alert('Gagal menyimpan di perangkat. Data terakhir mungkin belum tersimpan.'); }
  }
};

/* ---------- Sinkron ke Google Apps Script ---------- */
/* Tempel URL Web App (berakhiran /exec) di antara tanda kutip: */
const API_URL = '';
const KEY_KEY = 'kasPribadi.key', OUT_KEY = 'kasPribadi.outbox';
const Sync = {
  outbox: (()=>{ try{ return JSON.parse(localStorage.getItem(OUT_KEY)||'[]'); }catch(e){ return []; } })(),
  busy: false, timer: null,
  saveOut(){ try{ localStorage.setItem(OUT_KEY, JSON.stringify(this.outbox)); }catch(e){} updateSyncBadge(); },
  key(){
    let k = ''; try{ k = localStorage.getItem(KEY_KEY) || ''; }catch(e){}
    if (!k){ k = (prompt('Masukkan KUNCI AKSES KAS PRIBADI (dari Apps Script):') || '').trim(); if (k) try{ localStorage.setItem(KEY_KEY,k); }catch(e){} }
    return k;
  },
  async call(action, payload){
    const key = this.key(); if (!key) throw new Error('NO_KEY');
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify({ key, action, payload: payload||{} }) });
    const j = await res.json();
    if (!j.ok && j.error==='UNAUTHORIZED'){ try{ localStorage.removeItem(KEY_KEY); }catch(e){} alert('Kunci akses salah. Masukkan lagi.'); throw new Error('UNAUTHORIZED'); }
    return j;
  },
  push(action, payload, k){
    if (!API_URL) return;
    // gabungkan: perubahan terbaru untuk data yang sama menggantikan yang lama (yang belum terkirim)
    this.outbox = this.outbox.filter((op,i)=> !(op.k===k && !(this.busy && i===0)));
    this.outbox.push({ action, payload, k });
    this.saveOut(); this.flush();
  },
  async flush(){
    if (!API_URL || this.busy || !this.outbox.length) return;
    this.busy = true;
    try {
      while (this.outbox.length){
        const op = this.outbox[0];
        const j = await this.call(op.action, op.payload);
        if (!j.ok){
          if (j.error==='BUSY') throw new Error('BUSY');
          alert('Gagal menyimpan ke Google Sheets: ' + j.error);
        }
        this.outbox.shift(); this.saveOut();
      }
    } catch(e){
      clearTimeout(this.timer); this.timer = setTimeout(()=>this.flush(), 15000);
    } finally { this.busy = false; updateSyncBadge(); }
  },
  async pull(){
    if (!API_URL) return;
    await this.flush();
    if (this.outbox.length || this.busy) return;
    let j; try { j = await this.call('getAll'); } catch(e){ return; }
    if (!j.ok || this.outbox.length) return;
    const d = j.data;
    S.transaksi = d.transaksi || []; S.nabung = d.nabung || []; S.finance = d.finance || {};
    if (d.namaList && d.namaList.length) S.namaList = d.namaList;
    persist(); refreshView();
  }
};
function updateSyncBadge(){
  const el = document.getElementById('sync-badge'); if (!el) return;
  el.classList.toggle('hidden', !API_URL || !Sync.outbox.length);
}
function refreshView(){
  const a = document.activeElement;
  if (a && a.tagName==='INPUT' && a.type!=='date'){ pendingRefresh = true; return; }
  pendingRefresh = false;
  if (currentPage()==='transaksi') renderTrx(); else { renderNab(); renderPanels(); }
}
let pendingRefresh = false;
document.addEventListener('focusout', ()=>{ if (pendingRefresh) setTimeout(()=>{ const a=document.activeElement; if(!(a && a.tagName==='INPUT')) refreshView(); },50); });
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') Sync.pull(); });
window.addEventListener('online', ()=>Sync.flush());
function trxOut(r){ return { id:r.id, tanggal:r.tanggal, nama:r.nama, debit:r.debit, kredit:r.kredit, saldoManual:r.saldoManual, keterangan:r.keterangan, status:r.status, urut:r.urut }; }
function nabOut(r){ return { id:r.id, tanggal:r.tanggal, debit:r.debit, kredit:r.kredit, saldoManual:r.saldoManual, urut:r.urut }; }

/* ---------- Util ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const t=new Date(); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
function addDays(iso,n){ const [y,m,d]=iso.split('-').map(Number); const t=new Date(y,m-1,d+n); return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate()); }
function fmtDate(iso){ if(!iso) return ''; const [y,m,d]=iso.split('-'); return d+'/'+m+'/'+y; }
function dayName(iso){ const [y,m,d]=iso.split('-').map(Number); return HARI[new Date(y,m-1,d).getDay()]; }
function parseDate(str, refISO){
  str = String(str||'').trim(); if(!str) return null;
  const p = str.split(/[\/\-.\s]+/).filter(Boolean).map(Number);
  if (p.length < 2 || p.some(isNaN)) return null;
  let [d,m,y] = p;
  if (!y) y = Number((refISO||todayISO()).slice(0,4));
  if (y < 100) y += 2000;
  const t = new Date(y,m-1,d);
  if (t.getFullYear()!==y || t.getMonth()!==m-1 || t.getDate()!==d) return null;
  return y+'-'+pad(m)+'-'+pad(d);
}
const NF = new Intl.NumberFormat('id-ID',{maximumFractionDigits:0});
function fmtNum(n){ return (n===null||n===undefined||n==='') ? '' : NF.format(n); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)); }
let urutSeq = 0;
function nextUrut(){ return Date.now()*1000 + (urutSeq++ % 1000); }

/* Ekspresi angka: + - * / ( ). Titik = pemisah ribuan. Tanpa eval. */
function evalExpr(raw){
  let s = String(raw==null?'':raw).trim();
  if (s === '') return null;
  s = s.replace(/\s+/g,'').replace(/rp/gi,'').replace(/\./g,'').replace(/,/g,'.').replace(/[x×]/gi,'*').replace(/[÷:]/g,'/');
  if (!/^[0-9+\-*/().]+$/.test(s)) return NaN;
  let i = 0;
  function num(){
    if (s[i]==='('){ i++; const v=expr(); if(s[i]!==')') throw 0; i++; return v; }
    if (s[i]==='-'){ i++; return -num(); }
    if (s[i]==='+'){ i++; return num(); }
    const m = /^\d+(\.\d+)?/.exec(s.slice(i)); if(!m) throw 0; i += m[0].length; return parseFloat(m[0]);
  }
  function term(){ let v=num(); while(s[i]==='*'||s[i]==='/'){ const o=s[i++]; const r=num(); if(o==='*') v*=r; else { if(r===0) throw 0; v/=r; } } return v; }
  function expr(){ let v=term(); while(s[i]==='+'||s[i]==='-'){ const o=s[i++]; const r=term(); v = o==='+' ? v+r : v-r; } return v; }
  try { const v = expr(); if (i !== s.length || !isFinite(v)) return NaN; return Math.round(v); }
  catch(e){ return NaN; }
}

/* ---------- State ---------- */
const S = Store.load();
function persist(){ Store.save(S); }
let trxDraft = blankTrx(lastTrxDate() || todayISO());
let nabDraft = blankNab(null);
function blankTrx(tgl){ return { id:'new', tanggal:tgl, nama:'', debit:null, kredit:null, saldoManual:null, keterangan:'', status:'' }; }
function blankNab(tgl){ return { id:'new', tanggal: tgl || nextNabDate(), debit:null, kredit:null, saldoManual:null }; }
function lastTrxDate(){ const s=sortedTrx(); return s.length ? s[s.length-1].tanggal : null; }
function nextNabDate(){ const s=sortedNab(); return s.length ? addDays(s[s.length-1].tanggal,1) : todayISO(); }
function sortedTrx(){ return S.transaksi.slice().sort((a,b)=> a.tanggal.localeCompare(b.tanggal) || a.urut-b.urut); }
function sortedNab(){ return S.nabung.slice().sort((a,b)=> a.tanggal.localeCompare(b.tanggal) || a.urut-b.urut); }

function computeTrx(){
  let prev = 0, lastNama = '';
  return sortedTrx().map(r=>{
    const saldo = r.saldoManual!=null ? r.saldoManual : prev + (r.debit||0) - (r.kredit||0);
    prev = saldo;
    const kategori = r.nama ? r.nama : lastNama;   // nama kosong mewarisi nama sebelumnya (internal)
    if (r.nama) lastNama = r.nama;
    return Object.assign({}, r, { saldo, kategori });
  });
}
function computeNab(){
  let prev = 0;
  return sortedNab().map(r=>{
    const saldo = r.saldoManual!=null ? r.saldoManual : prev + (r.debit||0) - (r.kredit||0);
    prev = saldo; return Object.assign({}, r, { saldo });
  });
}
function addNama(n){
  n = (n||'').trim(); if(!n) return n;
  const hit = S.namaList.find(x=>x.toLowerCase()===n.toLowerCase());
  if (hit) return hit;
  S.namaList.push(n); return n;
}

const trxBody = document.getElementById('trx-body');

function renderTrx(){
  const rows = computeTrx();
  const last = rows.length ? rows[rows.length-1].saldo : 0;
  document.getElementById('total-saldo').textContent = (last<0?'-Rp':'Rp') + fmtNum(Math.abs(last));
  let html = '', prevDate = null, gi = -1, prevSaldo = last;

    html += trxRowHTML(r, first, ROW_COLORS[gi % ROW_COLORS.length], false);

function trxRowHTML(r, first, col, isDraft){

function getTrx(id){ return id==='new' ? trxDraft : S.transaksi.find(r=>r.id===id); }
function trxIsEmpty(r){ return !r.nama && r.debit==null && r.kredit==null && r.saldoManual==null && !r.keterangan && !r.status; }

/* Simpan satu sel. Return false jika input tidak valid. */
function commitTrx(input){
  const tr = input.closest('tr'); if(!tr) return true;
  const id = tr.dataset.id, f = input.dataset.f, r = getTrx(id); if(!r) return true;
  const v = input.value;
  if (f==='tanggal'){
    if (v.trim()===''){ return true; }               // tanggal tidak boleh kosong: abaikan
    const iso = parseDate(v, r.tanggal); if(!iso){ flagErr(input); return false; }
    r.tanggal = iso;
  } else if (f==='nama'){
    r.nama = v.trim() ? addNama(v) : '';
  } else if (f==='debit' || f==='kredit'){
    const n = evalExpr(v); if (Number.isNaN(n)){ flagErr(input); return false; }
    r[f] = (n===0 && v.trim()==='') ? null : n;
  } else if (f==='saldo'){
    const n = evalExpr(v); if (Number.isNaN(n)){ flagErr(input); return false; }
    if (n===null) r.saldoManual = null;
    else {
      const auto = autoSaldoFor(id);
      r.saldoManual = (input.dataset.orig === v && r.saldoManual==null) ? null : (n===auto && r.saldoManual==null ? null : n);
    }
  } else if (f==='keterangan'){
    r.keterangan = v.trim();
  }
  if (id!=='new'){
    if (trxIsEmpty(r) && confirm('Baris ini kosong. Hapus baris?')){
      S.transaksi = S.transaksi.filter(x=>x.id!==id);
      Sync.push('deleteTransaksi', { id }, 'trx:'+id);
    } else Sync.push('saveTransaksi', { row: trxOut(r) }, 'trx:'+id);
    persist();
  }
  return true;
}
function autoSaldoFor(id){
  const rows = computeTrx();
  if (id==='new'){ return rows.length ? rows[rows.length-1].saldo + (trxDraft.debit||0) - (trxDraft.kredit||0) : (trxDraft.debit||0)-(trxDraft.kredit||0); }
  const i = rows.findIndex(r=>r.id===id); const prev = i>0 ? rows[i-1].saldo : 0; const r = rows[i];
  return prev + (r.debit||0) - (r.kredit||0);
}
let draftBusy = false;
function commitDraft(){
  if (draftBusy) return false;
  const d = trxDraft;
  if (!d.nama && d.debit==null && d.kredit==null && d.saldoManual==null && !d.keterangan) return false;
  draftBusy = true;
  const rec = Object.assign({}, d, { id: uid(), urut: nextUrut() });
  S.transaksi.push(rec); persist();
  Sync.push('saveTransaksi', { row: trxOut(rec) }, 'trx:'+rec.id);
  trxDraft = blankTrx(rec.tanggal);
  draftBusy = false;
  return true;
}
function flagErr(input){ input.classList.add('err'); setTimeout(()=>input.classList.remove('err'),1400); }

function focusTrx(id, f){
  const tr = trxBody.querySelector(`tr[data-id="${CSS.escape(id)}"]`); if(!tr) return;
  const el = tr.querySelector(`[data-f="${f}"]`); if(!el) return;
  el.focus({preventScroll:false});
  if (el.select) try{ el.select(); }catch(e){}
}
function nextRowId(id){
  const rows = sortedTrx(); const i = rows.findIndex(r=>r.id===id);
  return (i>=0 && i<rows.length-1) ? rows[i+1].id : 'new';
}

let skipBlur = null;
trxBody.addEventListener('focusin', e=>{
  const el = e.target; if(el.tagName!=='INPUT') return;
  el.dataset.orig = el.value;
  if (el.dataset.f==='tanggal' && !el.value) { el.value = el.dataset.full; el.dataset.orig = el.value; }
  if (el.select) setTimeout(()=>{ try{ el.select(); }catch(_){} },0);
});
trxBody.addEventListener('focusout', e=>{
  const el = e.target; if(el.tagName!=='INPUT') return;
  closeSuggest();
  if (skipBlur === el){ skipBlur = null; return; }
  const tr = el.closest('tr'); const id = tr && tr.dataset.id;
  let changed = false;
  if (el.value === el.dataset.orig){
    if (el.dataset.f==='tanggal' && !tr.querySelector('.day')) el.value = '';
  } else {
    const ok = commitTrx(el);
    if (!ok){ el.value = el.dataset.orig; } else changed = true;
  }
  // Pindah keluar dari baris baru yang sudah berisi angka -> simpan otomatis
  setTimeout(()=>{
    const active = document.activeElement;
    const stillInRow = active && active.closest && active.closest('tr') && active.closest('tr').dataset.id === id && trxBody.contains(active);
    let saved = false;
    if (id==='new' && !stillInRow){
      const d = trxDraft;
      if (d.debit!=null || d.kredit!=null || d.saldoManual!=null) { saved = commitDraft(); }
    }
    if (changed || saved) {
      const keep = active && trxBody.contains(active) && active.tagName==='INPUT' ? { id: active.closest('tr').dataset.id, f: active.dataset.f } : null;
      if (keep && keep.id==='new' && !trxBody.querySelector('tr[data-id="new"]')) keep.id='new';
      renderTrx();
      if (keep) focusTrx(keep.id==='new' || S.transaksi.some(r=>r.id===keep.id) ? keep.id : 'new', keep.f);
    }
  },0);
});
trxBody.addEventListener('keydown', e=>{
  const el = e.target; if(el.tagName!=='INPUT') return;
  if (e.key==='ArrowDown' || e.key==='ArrowUp'){ if (moveSuggest(e.key==='ArrowDown'?1:-1)) { e.preventDefault(); return; } }
  if (e.key==='Escape'){ closeSuggest(); return; }
  if (e.key!=='Enter') return;
  e.preventDefault();
  const tr = el.closest('tr'); const id = tr.dataset.id; const f = el.dataset.f;
  if (f==='nama' && pickSuggestOnEnter(el)) {}
  skipBlur = el;
  if (el.value !== el.dataset.orig){ if(!commitTrx(el)){ skipBlur=null; el.value=el.dataset.orig; return; } }
  let target;
  if (f==='keterangan'){
    if (id==='new'){ commitDraft(); target = {id:'new', f:'nama'}; }
    else target = { id: nextRowId(id), f:'nama' };
  } else if (f==='saldo'){
    target = { id, f:'keterangan' };
  } else {
    target = { id, f: TRX_ORDER[TRX_ORDER.indexOf(f)+1] };
  }
  closeSuggest();
  renderTrx();
  if (target.id!=='new' && !S.transaksi.some(r=>r.id===target.id)) target.id='new';
  focusTrx(target.id, target.f);
  if (id==='new' && f==='keterangan') scrollBottom('trx-wrap');
});

/* ----- Autocomplete Nama ----- */
let sugg = null; // {input, ul, items, idx}
trxBody.addEventListener('input', e=>{
  const el = e.target; if (el.dataset.f!=='nama') return;
  const q = el.value.trim().toLowerCase();
  closeSuggest();
  if (!q) return;
  const items = S.namaList.filter(n=>n.toLowerCase().includes(q)).slice(0,8);
  if (!items.length) return;
  const ul = document.createElement('ul'); ul.className='suggest'; ul.setAttribute('role','listbox'); ul.setAttribute('aria-label','Saran nama');
  if (el.closest('tr').dataset.id==='new' || isNearBottom(el)) ul.classList.add('up');
  ul.innerHTML = items.map((n,i)=>{ const k=n.toLowerCase().indexOf(q); return `<li role="option" data-v="${esc(n)}"><span>${esc(n.slice(0,k))}<b>${esc(n.slice(k,k+q.length))}</b>${esc(n.slice(k+q.length))}</span></li>`; }).join('');
  el.parentElement.appendChild(ul);
  sugg = { input: el, ul, items, idx: -1 };
  ul.addEventListener('pointerdown', ev=>{
    const li = ev.target.closest('li'); if(!li) return;
    ev.preventDefault();
    el.value = li.dataset.v; closeSuggest();
    const id = el.closest('tr').dataset.id; skipBlur = el;
    commitTrx(el); renderTrx(); focusTrx(S.transaksi.some(r=>r.id===id)?id:'new', 'debit');
  });
});
function isNearBottom(el){ const w=document.getElementById('trx-wrap').getBoundingClientRect(); const r=el.getBoundingClientRect(); return w.bottom - r.bottom < 260; }
function closeSuggest(){ if (sugg){ sugg.ul.remove(); sugg=null; } }
function moveSuggest(d){ if(!sugg) return false; sugg.idx = Math.max(0, Math.min(sugg.items.length-1, sugg.idx+d)); [...sugg.ul.children].forEach((li,i)=>li.classList.toggle('on', i===sugg.idx)); return true; }
function pickSuggestOnEnter(el){
  if (!sugg) return false;
  if (sugg.idx >= 0){ el.value = sugg.items[sugg.idx]; return true; }
  const exact = sugg.items.find(n=>n.toLowerCase()===el.value.trim().toLowerCase());
  if (exact){ el.value = exact; return true; }
  return false;
}

function nabRowHTML(r, bg, isDraft){

<td ${tdS}>${manual?PEN:''}<input data-f="saldo" class="num saldo ${r.saldo<0?'neg':''}" inputmode="decimal" value="${fmtNum(r.saldo)}" aria-label="Saldo" autocomplete="off" enterkeyhint="done"></td>

function getNab(id){ return id==='new' ? nabDraft : S.nabung.find(r=>r.id===id); }
function autoNabFor(id){

function commitNab(input){

let nabBusy = false;

function focusNab(id,f){ const tr = nabBody.querySelector(`tr[data-id="${CSS.escape(id)}"]`); if(!tr) return; const el = tr.querySelector(`[data-f="${f}"]`); if(el){ el.focus(); try{ el.select(); }catch(e){} } }

nabBody.addEventListener('focusin', e=>{ const el=e.target; if(el.tagName!=='INPUT') return; el.dataset.orig = el.value; setTimeout(()=>{ try{ el.select(); }catch(_){} },0); });

  } else target = { id, f: NAB_ORDER[NAB_ORDER.indexOf(f)+1] };
  renderNab();
  if (target.id!=='new' && !S.nabung.some(r=>r.id===target.id)) target.id='new';
  focusNab(target.id, target.f);
  if (target.id==='new') scrollBottom('nab-wrap');
});

/* =========================================================
   HALAMAN FINANCE — DUA TANGGAL
   ========================================================= */
function blankFin(){ return { sumber:{}, extraBefore:[{nama:'',nominal:null},{nama:'',nominal:null}], tabungan:null, extraAfter:[{nama:'',nominal:null},{nama:'',nominal:null}] }; }
function getFin(date){ return S.finance[date] || blankFin(); }
function finCalc(f){
  const total = SUMBER.reduce((a,k)=>a+(f.sumber[k]||0),0) + f.extraBefore.reduce((a,x)=>a+(x.nominal||0),0);
  const saldo = total - (f.tabungan||0) - f.extraAfter.reduce((a,x)=>a+(x.nominal||0),0);
  return { total, saldo };
}
function finIsEmpty(f){
  return SUMBER.every(k=>f.sumber[k]==null) && f.tabungan==null &&
    f.extraBefore.every(x=>!x.nama && x.nominal==null) && f.extraAfter.every(x=>!x.nama && x.nominal==null);
}
const PANEL_TINT = { left:['#C5DCFF','#A3C2EE'], right:['#BCEBCF','#93D0AC'] };
function renderPanels(){ renderPanel('left'); renderPanel('right'); }
function renderPanel(side){
  const date = S.view[side]; const f = getFin(date); const c = finCalc(f); const [tint,tb] = PANEL_TINT[side];
  const valIn = (key,val,cls='') => `<td><input data-k="${key}" class="num ${cls}" inputmode="decimal" value="${fmtNum(val)}" aria-label="Nominal" autocomplete="off" enterkeyhint="next" style="padding:0 14px"></td>`;
  const nameIn = (key,val) => `<td class="name"><input data-k="${key}" value="${esc(val)}" aria-label="Nama sumber" autocomplete="off" autocapitalize="words" enterkeyhint="next"></td>`;
  let rows = SUMBER.map(k=>`<tr><td class="name">${k}</td>${valIn('src:'+k, f.sumber[k])}</tr>`).join('');
  rows += f.extraBefore.map((x,i)=>`<tr>${nameIn('xbn:'+i,x.nama)}${valIn('xbv:'+i,x.nominal)}</tr>`).join('');
  rows += `<tr class="total"><td class="name">Total</td><td class="v ${c.total<0?'neg':''}">${fmtNum(c.total)}</td></tr>`;
  rows += `<tr class="tab"><td class="name">Uang Tabungan</td>${valIn('tab',f.tabungan)}</tr>`;
  rows += f.extraAfter.map((x,i)=>`<tr>${nameIn('xan:'+i,x.nama)}${valIn('xav:'+i,x.nominal)}</tr>`).join('');
  rows += `<tr class="saldo"><td class="name">SALDO</td><td class="v ${c.saldo<0?'neg':''}">${fmtNum(c.saldo)}</td></tr>`;
  const el = document.getElementById('panel-'+side);
  el.setAttribute('aria-label','Rekap '+fmtDate(date));
  el.innerHTML = `<div class="col-head" style="background:${tint};border-color:${tb}">
<label class="datebtn" style="border:1px solid ${tb}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D4F73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
<span class="t"><small>${dayName(date)}</small><span>${fmtDate(date)}</span></span>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D4F73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
<input type="date" data-side="${side}" value="${date}" aria-label="Pilih tanggal">
</label></div>
<table class="fin-table"><colgroup><col><col style="width:48%"></colgroup>
<thead><tr><th scope="col">SUMBER UANG</th><th scope="col" class="r">NOMINAL</th></tr></thead>
<tbody data-side="${side}">${rows}</tbody></table>`;
}
function commitFin(side, input){
  const date = S.view[side]; const k = input.dataset.k; const v = input.value;
  const f = S.finance[date] ? S.finance[date] : blankFin();
  const [kind, key] = k.split(':');
  if (kind==='xbn' || kind==='xan'){
    (kind==='xbn'?f.extraBefore:f.extraAfter)[+key].nama = v.trim();
  } else {
    const n = evalExpr(v); if (Number.isNaN(n)){ flagErr(input); return false; }
    if (kind==='src') f.sumber[key] = n;
    else if (kind==='tab') f.tabungan = n;
    else if (kind==='xbv') f.extraBefore[+key].nominal = n;
    else if (kind==='xav') f.extraAfter[+key].nominal = n;
  }
  if (finIsEmpty(f)){ delete S.finance[date]; Sync.push('deleteFinance', { tanggal: date }, 'fin:'+date); }
  else { S.finance[date] = f; Sync.push('saveFinance', { tanggal: date, data: f }, 'fin:'+date); }
  persist(); return true;
}
const finPage = document.getElementById('page-finance');
let finSkip = null;
finPage.addEventListener('change', e=>{
  const el = e.target; if (el.type!=='date' || !el.value) return;
  S.view[el.dataset.side] = el.value; persist(); renderPanels();
});
finPage.addEventListener('focusin', e=>{ const el=e.target; if(!el.dataset.k) return; el.dataset.orig = el.value; setTimeout(()=>{ try{ el.select(); }catch(_){} },0); });
finPage.addEventListener('focusout', e=>{
  const el=e.target; if(!el.dataset.k) return;
  if (finSkip===el){ finSkip=null; return; }
  if (el.value===el.dataset.orig) return;
  const side = el.closest('tbody').dataset.side;
  if (!commitFin(side, el)) { el.value = el.dataset.orig; return; }
  setTimeout(()=>{
    const a = document.activeElement; const keep = a && a.dataset && a.dataset.k ? { side: a.closest('tbody').dataset.side, k: a.dataset.k } : null;
    renderPanels(); if (keep) focusFin(keep.side, keep.k);
  },0);
});
finPage.addEventListener('keydown', e=>{
  const el=e.target; if(!el.dataset.k || e.key!=='Enter') return;
  e.preventDefault();
  const tb = el.closest('tbody'); const side = tb.dataset.side;
  const list = [...tb.querySelectorAll('input[data-k]')]; const i = list.indexOf(el);
  const next = list[i+1] ? list[i+1].dataset.k : null;
  finSkip = el;
  if (el.value!==el.dataset.orig && !commitFin(side, el)){ finSkip=null; el.value=el.dataset.orig; return; }
  renderPanels();
  if (next) focusFin(side, next); else document.activeElement && document.activeElement.blur();
});
function focusFin(side,k){ const el = document.querySelector(`#panel-${side} input[data-k="${CSS.escape(k)}"]`); if(el){ el.focus(); try{ el.select(); }catch(_){} } }

/* ----- Riwayat ----- */
const riw = document.getElementById('riwayat');
document.getElementById('btn-riwayat').addEventListener('click', ()=>{
  const dates = Object.keys(S.finance).sort().reverse();
  const ul = document.getElementById('riwayat-list');
  ul.innerHTML = dates.length ? dates.map(d=>{ const c=finCalc(S.finance[d]); return `<li><div class="d"><small>${dayName(d)}</small><b>${fmtDate(d)}</b><span>Saldo ${fmtNum(c.saldo)}</span></div><div class="acts"><button type="button" data-d="${d}" data-s="left" aria-label="Buka ${fmtDate(d)} di tabel kiri">Kiri</button><button type="button" data-d="${d}" data-s="right" aria-label="Buka ${fmtDate(d)} di tabel kanan">Kanan</button></div></li>`; }).join('')
    : '<li class="empty">Belum ada catatan.</li>';
  riw.classList.remove('hidden');
  document.getElementById('riwayat-close').focus();
});
riw.addEventListener('click', e=>{
  if (e.target===riw || e.target.closest('#riwayat-close')){ riw.classList.add('hidden'); return; }
  const b = e.target.closest('button[data-d]'); if(!b) return;
  S.view[b.dataset.s] = b.dataset.d; persist(); renderPanels(); riw.classList.add('hidden');
});
document.addEventListener('keydown', e=>{ if (e.key==='Escape' && !riw.classList.contains('hidden')) riw.classList.add('hidden'); });

/* ---------- Mulai ---------- */
showPage();
updateSyncBadge();
Sync.pull();
</script>
